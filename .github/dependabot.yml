version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go:
        patterns: ["*"]

  # The desktop app.
  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: weekly
    groups:
      app-electron:
        patterns: ["electron", "electron-builder", "@electron/*"]
      app:
        patterns: ["*"]

  # The Android app. Expo SDK packages move together; upgrade them with `npx expo install --fix`
  # in one pull request rather than one by one.
  - package-ecosystem: npm
    directory: /phone
    schedule:
      interval: weekly
    groups:
      phone-expo:
        patterns: ["expo", "expo-*", "@expo/*", "react", "react-native", "react-dom", "@react-native/*"]
      phone:
        patterns: ["*"]
    # Major versions (the next Expo SDK, Jest, TypeScript, ESLint) are a planned upgrade done
    # by hand and tested on a device, not a weekly pull request. Security updates still come.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # The Python tools the spec check uses in CI.
  - package-ecosystem: pip
    directory: /scripts/ci
    schedule:
      interval: weekly
    groups:
      spec-tools:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
