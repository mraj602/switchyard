version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go:
        patterns: ["*"]

  # The desktop app.
  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: weekly
    groups:
      app-electron:
        patterns: ["electron", "electron-builder", "@electron/*"]
      app:
        patterns: ["*"]

  # The Android app. Expo SDK packages move together; upgrade them with `npx expo install --fix`
  # in one pull request rather than one by one.
  - package-ecosystem: npm
    directory: /phone
    schedule:
      interval: weekly
    groups:
      phone-expo:
        patterns: ["expo", "expo-*", "@expo/*", "react", "react-native", "react-dom", "@react-native/*"]
      phone:
        patterns: ["*"]
    # Each Expo SDK pins the React Native, React and native-module versions it supports, and
    # React Native's 0.x minors are breaking, so only patch updates come weekly. Anything newer
    # (the next Expo SDK, Jest, TypeScript, ESLint) is a planned upgrade with
    # `npx expo install --fix`, tested on a device. Security updates still come.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  # The Python tools the spec check uses in CI.
  - package-ecosystem: pip
    directory: /scripts/ci
    schedule:
      interval: weekly
    groups:
      spec-tools:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
