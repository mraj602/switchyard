# The Android app (phone/): typecheck, lint, jest, the secrets check and both prebuild checks
# on every change; an unsigned Android debug compile on main and on demand, and an iOS
# simulator compile on demand only (the iOS code is kept compiling but is not released).
# Nothing is signed, uploaded or submitted, and no EAS command runs here. `make phone-check`
# runs the same checks locally. Spec: docs/spec/phone.md. Action SHAs re-checked with
# `git ls-remote` on 2026-10-13 (actions/setup-java v6.0.1, released 2026-09-09).
name: phone

on:
  workflow_dispatch:
  pull_request:
    paths: ["phone/**", "internal/hub/push/**", ".github/workflows/phone.yml"]
  push:
    branches: [main]
    paths: ["phone/**", "internal/hub/push/**", ".github/workflows/phone.yml"]

permissions:
  contents: read

concurrency:
  group: phone-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # typecheck, lint, tests, secrets, and the android and ios prebuild sanity checks
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: phone
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: phone/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx eslint .
      - run: npx jest --ci
      - run: node scripts/check-no-secrets.mjs
      # prebuild --no-install --clean into a temporary copy of phone/, then assert (phone.md P14)
      - run: node scripts/prebuild-check.mjs android
      - run: node scripts/prebuild-check.mjs ios # wave 0 fact 2: the iOS prebuild works on Linux

  # native compile, unsigned debug, never uploaded
  android-debug:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: phone
    env:
      SY_APP_VARIANT: development
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: phone/package-lock.json
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle # ~/.gradle caches; android/ is generated, so key on the npm lockfile
          cache-dependency-path: phone/package-lock.json
      - run: npm ci
      - run: npx expo prebuild --platform android --no-install --clean
      - run: ./gradlew :app:assembleDebug :sy-link:testDebugUnitTest :sy-tabs:testDebugUnitTest --no-daemon
        working-directory: phone/android

  # native compile for the simulator, no signing
  ios-sim:
    if: github.event_name == 'workflow_dispatch'
    needs: check
    runs-on: macos-latest
    defaults:
      run:
        working-directory: phone
    env:
      SY_APP_VARIANT: development
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: phone/package-lock.json
      - run: npm ci
      - run: npx expo prebuild --platform ios --clean # installs the pods on macOS
      - name: xcodebuild (simulator, unsigned)
        run: |
          ws="$(ls -d ios/*.xcworkspace | head -n 1)"
          scheme="$(basename "$ws" .xcworkspace)"
          xcodebuild -workspace "$ws" -scheme "$scheme" -sdk iphonesimulator -configuration Debug \
            CODE_SIGNING_ALLOWED=NO build
