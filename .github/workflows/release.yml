# Release: a tag v<semver> runs the checks, builds the six archives with
# scripts/release/build.sh (the same script the E2E harness uses), attests build provenance
# for every archive and publishes a GitHub Release with every file. See docs/spec/setup.md 1.1.
#
# Phone releases (`phone-vX.Y.Z`) are not built here: `v*` does not match them, and the Android
# APK is signed with the owner's own keystore on their laptop (`make phone-apk-release`,
# docs/spec/phone.md P13, P16.1), never by CI.
name: release

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Read-only: validates the tag, requires its commit to be on main, runs `make check`.
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Validate the tag
        run: |
          printf '%s\n' "${GITHUB_REF_NAME}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$' || {
            echo "bad release tag: ${GITHUB_REF_NAME}"; exit 1; }

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Tagged commit must be on main
        run: |
          git rev-parse --verify --quiet refs/remotes/origin/main >/dev/null || {
            echo "origin/main is not available"; exit 1; }
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main || {
            echo "${GITHUB_SHA} is not an ancestor of origin/main; refusing to release"; exit 1; }

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.27.x"
          cache: true

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install spec tools (hash-pinned)
        run: python -m pip install --disable-pip-version-check --require-hashes -r scripts/ci/requirements.txt

      - name: Check
        run: make check PYTHON=python

  release:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write      # gh release create
      id-token: write      # OIDC token for the attestation
      attestations: write  # store the attestation
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.27.x"
          cache: false  # a release must not consume a cache a pull request could have poisoned

      - name: Build archives
        run: scripts/release/build.sh "${GITHUB_REF_NAME}"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: |
            dist/release/sy_*.tar.gz
            dist/release/sy_*.zip

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=""
          case "${GITHUB_REF_NAME}" in *-*) flags="--prerelease" ;; esac
          gh release create "${GITHUB_REF_NAME}" dist/release/* \
            --verify-tag --generate-notes --title "${GITHUB_REF_NAME}" $flags
