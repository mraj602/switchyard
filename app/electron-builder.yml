# Packaging for public builds. Nothing here publishes or signs: `publish` is null (and the
# scripts pass --publish never), the mac build has no identity and no notarizing, Windows has
# no signing, and electron-updater is not a dependency, so the app never updates itself: a new
# version is a new download. Signing and publishing are manual steps for a release.
#
# Targets: Linux AppImage, deb and rpm; macOS dmg; Windows NSIS installer. Unsigned macOS and
# Windows builds trigger Gatekeeper and SmartScreen warnings on first start.
appId: io.github.mraj602.watchyard.desktop
productName: Watchyard
copyright: Copyright (c) Watchyard contributors
# deb and rpm need a homepage and a maintainer.
extraMetadata:
  homepage: https://github.com/mraj602/watchyard
  author:
    name: Watchyard contributors
    email: noreply@watchyard.invalid
asar: true
npmRebuild: false
nodeGypRebuild: false
buildDependenciesFromSource: false
publish: null
afterPack: build/after-pack.cjs

directories:
  buildResources: build
  output: dist

# No runtime npm dependencies, so only the app's own code goes in the asar. Tests, the
# renderer's dev page and the test hooks never ship (a packaging test checks the asar).
files:
  - package.json
  - src/**/*
  - assets/**/*
  - "!**/*.test.js"
  - "!**/*.test.mjs"
  - "!**/*.test.cjs"
  - "!src/renderer/dev/**"
  - "!src/main/test-hooks.js"

# The bundled `wy` (scripts/fetch-wy.mjs fills resources/wy/<os>-<arch>/) lands at
# <resources>/wy/wy[.exe], outside the asar so it can be executed.
extraResources:
  - from: resources/wy/${os}-${arch}/
    to: wy
    filter:
      - "wy*"

artifactName: Watchyard-${version}-${os}-${arch}.${ext}

linux:
  target: [AppImage, deb, rpm]
  category: Utility
  executableName: watchyard-desktop
  # package.json desktopName (watchyard-desktop.desktop) is Electron's Wayland app_id and the
  # libnotify desktop-entry hint; the .desktop file has that name and StartupWMClass, so GNOME
  # and KDE match the window, the dock and notifications to it (and show its icon).
  syncDesktopName: true
  synopsis: "Unofficial desktop app for Watchyard: Claude account tabs, web usage and the hub board (not affiliated with Anthropic)"
  description: Unofficial, self-hosted tool. Not affiliated with, endorsed by or sponsored by Anthropic. Claude and claude.ai are trademarks of Anthropic.
  maintainer: Watchyard contributors <noreply@watchyard.invalid>

mac:
  target: dmg
  category: public.app-category.utilities
  identity: null
  hardenedRuntime: false
  gatekeeperAssess: false
  notarize: false

win:
  target: nsis
  signAndEditExecutable: false
  verifyUpdateCodeSignature: false

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
