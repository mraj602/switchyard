# The Watchyard hub as a container.
#
#   cd deploy && docker compose up -d --build
#   docker compose exec hub wy hub token create --kind machine --name laptop --machine <id>
#
# By default the hub is published on 127.0.0.1 only. To reach it from other machines over
# Tailscale, add the override file (see docker-compose.tailscale.yml):
#
#   docker compose -f docker-compose.yml -f docker-compose.tailscale.yml up -d
#
# The hub port is never published on 0.0.0.0.
name: watchyard

services:
  hub:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        VERSION: ${WY_VERSION:-dev}
        COMMIT: ${WY_COMMIT:-}
    image: watchyard-hub:latest
    container_name: watchyard-hub
    restart: unless-stopped
    ports:
      - "${WY_BIND:-127.0.0.1}:${WY_PORT:-8787}:8787"
    volumes:
      - hub-data:/data
    # WY_PUBLIC_URL (in .env) is the https address phones open, e.g. the
    # https://<name>.<tailnet>.ts.net of `tailscale serve --bg 8787` (deploy/README.md C).
    command: ["hub", "serve", "--listen", "0.0.0.0:8787", "--insecure-lan", "--trusted-proxy", "${WY_TRUSTED_PROXY:-172.16.0.0/12}", "--public-url", "${WY_PUBLIC_URL:-}"]
    # Published ports reach the container from the Docker bridge gateway, so the hub trusts
    # X-Forwarded-For/-Proto from Docker's default bridge ranges (172.16.0.0/12). Set
    # WY_TRUSTED_PROXY if your Docker uses other ranges (docker network inspect).
    environment:
      TZ: ${TZ:-UTC}
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]

volumes:
  hub-data:
    # The volume keeps the name the first release gave it, so the hub's data stays where it is
    # whatever this project is called (docs/spec/rename.md 2.11).
    name: switchyard_hub-data # rename:keep
