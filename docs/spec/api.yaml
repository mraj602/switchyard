openapi: 3.1.0
info:
  title: Switchyard hub API
  version: "1.0.0"
  summary: Upload records from machines; read sessions, usage and machines.
  description: |
    Spec v1, phase 0. Implemented in `internal/hub/api` (phase 2).

    Unofficial; not affiliated with Anthropic.

    Rules:
    - Clients only write (`/v1/ingest`); viewers only read. Nothing in a reply can make a
      client do anything.
    - Every request except `/health` needs `Authorization: Bearer <token>` (tokens.md).
      `x-scopes` on each operation lists the scopes that may call it (any one is enough).
    - JSON everywhere, UTF-8. Times in replies are RFC 3339 UTC strings with milliseconds.
    - Errors use the `Error` schema. `401` = unknown or revoked token, `403` = missing scope.
    - Unknown query parameters are ignored. Unknown fields in replies must be ignored by
      clients (new fields are added without a version bump).
    - Paths marked `x-reserved` are named here so nothing else takes them; they return `501`
      until their phase. Phase 4 operations carry their final shapes while still reserved.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: http://127.0.0.1:8787
    description: Merged mode (hub on this laptop)
  - url: https://hub.example.ts.net
    description: Home server behind tailscale serve or Caddy
security:
  - bearer: []
  - cookie: []
tags:
  - name: ingest
  - name: read
  - name: live
  - name: meta
  - name: pairing
  - name: devices
  - name: push
  - name: alerts
  - name: keys
  - name: link
  - name: peers
  - name: app
  - name: reserved

paths:
  /health:
    get:
      tags: [meta]
      operationId: health
      summary: Up, version, schema
      security: []
      x-scopes: []
      responses:
        "200":
          description: Hub is up and the database is open.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Health"}
              example: {ok: true, version: "0.2.0", schema: 1, time: "2026-10-12T14:03:22.418Z"}
        "503":
          description: Hub is starting or the database is not usable.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Health"}

  /v1/session/login:
    post:
      tags: [meta]
      operationId: sessionLogin
      summary: Swap a token for a session cookie (web board)
      description: |
        The web board's login page posts a pasted token here. If it is a valid, unrevoked
        token with the `read` scope, the hub answers `204` and sets the cookie `sy_session`
        (`HttpOnly`, `SameSite=Strict`, `Path=/`, `Secure` when served over TLS, 30 days).
        The cookie holds a new token of its own: a `browser` device with the `read` scope
        only, recorded as made from the pasted token's device. Afterwards the read
        endpoints and `/v1/stream` accept that cookie. A cookie never carries `write` or
        `push`, even when a desktop token was pasted; revoking the pasted token's device
        revokes its board sessions. A desktop token keeps one board session: its login
        revokes the board sessions made from it before (the app's Hub view has one cookie
        jar). The board never keeps the token in JavaScript.
        Unknown or revoked token: `401`; a token without `read`: `403`; more than 10
        failed logins a minute: `429`. Same-origin only; no CORS headers are sent.
      security: []
      x-scopes: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: {type: string}
            example: {token: "sy_b_4fQx0Lr2..."}
      responses:
        "204": {description: Signed in; cookie set.}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}

  /v1/session/logout:
    post:
      tags: [meta]
      operationId: sessionLogout
      summary: Sign out (clear the session cookie and revoke its device)
      description: |
        Revokes the device behind the cookie when it is a board session, an owner session or
        a phone or browser paired in cookie mode (pairing.md 6), then clears the cookie. The
        pasted token of a board login stays valid; no other device is touched. A request whose
        `Origin` is not the hub's own only clears the cookie.
      security: []
      x-scopes: []
      responses:
        "204": {description: "Cookie cleared and its device revoked."}

  /v1/ingest:
    post:
      tags: [ingest]
      operationId: ingest
      summary: Upload a batch of records
      description: |
        Stores every record raw (record.md), then types it. Idempotent by record id.

        Every id in the batch appears exactly once in the reply: in `accepted` if it is stored
        now or was already stored from the same device (`duplicates` lists the latter, as a
        subset of `accepted`), or in `rejected` with a reason. The client advances past both.
        A malformed batch (not JSON, `v` unknown, no `records` array, over the size limit)
        is refused as a whole with `400`/`413` and the client keeps its records.

        If every record of the batch is rejected as `machine_mismatch` (the token is bound to
        another machine), the whole request is answered `403` with `code: machine_mismatch`
        and nothing is stored. The client keeps its outbox and cursor: the token is wrong,
        not the records. A batch that mixes mismatched and other records gets the normal `200`.
      x-scopes: [write]
      parameters:
        - name: Content-Encoding
          in: header
          required: false
          schema: {type: string, enum: [gzip, identity]}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/Batch"}
            example:
              v: 1
              client: sy/0.1.0
              records:
                - v: 1
                  id: 01JA2XQ8R7Y5V0Z6M3K1T9B4CD
                  kind: hook_event
                  ts: "2026-10-11T14:03:22.418Z"
                  machine: m_01JA2W5N0G8H3Q7S2V6X9Y1Z4K
                  slot: "~/.claude-2"
                  seat: {account: 3f1c6a2e-0000-4000-8000-000000000001, org: 9b20d4f1-0000-4000-8000-000000000002, src: claude_json}
                  derived: {last_message: "Should I also update the migration?"}
                  payload: {hook_event_name: Stop, session_id: c41e0000-0000-4000-8000-000000000003, cwd: /home/me/api}
      responses:
        "200":
          description: Batch answered.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/IngestReply"}
              example:
                accepted: [01JA2XQ8R7Y5V0Z6M3K1T9B4CD]
                duplicates: []
                rejected: []
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403":
          description: "Token lacks the scope, or (`code: machine_mismatch`) every record belongs to another machine than the token's."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "413":
          description: Batch over 8 MiB uncompressed or over 1000 records.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "429": {$ref: "#/components/responses/TooMany"}
        "503": {$ref: "#/components/responses/Unavailable"}

  /v1/overview:
    get:
      tags: [read]
      operationId: overview
      summary: Everything the home screens need, in one call
      x-scopes: [read]
      responses:
        "200":
          description: Seats with usage, sessions needing you, machine health.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Overview"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}

  /v1/sessions:
    get:
      tags: [read]
      operationId: listSessions
      summary: The session board
      description: |
        Sessions ordered by `needs_you` first, then `state_since` (oldest waiting first for
        needs-you, newest activity first for the rest). Ended and gone sessions are included
        only with `state=ended`, `state=gone` or `include_ended=true`, and only from the last
        `days` days.
      x-scopes: [read]
      parameters:
        - name: state
          in: query
          description: Comma-separated states, or `needs_you`.
          schema: {type: string, examples: ["needs_you", "working,done"]}
        - name: seat
          in: query
          description: Seat id(s), comma-separated.
          schema: {type: string}
        - name: machine
          in: query
          description: Machine id(s), comma-separated.
          schema: {type: string}
        - name: include_ended
          in: query
          schema: {type: boolean, default: false}
        - name: since
          in: query
          description: Only sessions with activity at or after this time (RFC 3339).
            Needs-you sessions are always included.
          schema: {type: string, format: date-time}
        - name: days
          in: query
          description: Only sessions with activity (activity_at) or a listing in the last `days` days.
            Needs-you sessions are always included.
          schema: {type: integer, minimum: 1, maximum: 365, default: 2}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 500, default: 200}
        - name: cursor
          in: query
          description: Opaque `next` value from a previous page.
          schema: {type: string}
      responses:
        "200":
          description: One page of sessions.
          content:
            application/json:
              schema:
                type: object
                required: [sessions]
                properties:
                  sessions:
                    type: array
                    items: {$ref: "#/components/schemas/Session"}
                  next: {type: [string, "null"]}
                  from: {type: string, format: date-time, description: "Start of the activity window (`since`, else now minus `days`), for \"showing the last 2 days\"."}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}

  /v1/sessions/{id}:
    get:
      tags: [read]
      operationId: getSession
      summary: One session with its timeline
      x-scopes: [read]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
      responses:
        "200":
          description: The session.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SessionDetail"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}

  /v1/accounts:
    get:
      tags: [read]
      operationId: listAccounts
      summary: Usage cards, one per seat
      description: |
        The plan's `/v1/seats`. Named "accounts" because that is the word on every screen;
        each item is one seat (account + org). `/v1/seats` is an alias.
      x-scopes: [read]
      parameters:
        - name: include_hidden
          in: query
          schema: {type: boolean, default: false}
      responses:
        "200":
          description: Seats.
          content:
            application/json:
              schema:
                type: object
                required: [accounts]
                properties:
                  accounts:
                    type: array
                    items: {$ref: "#/components/schemas/Seat"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}

  /v1/accounts/{seat}:
    patch:
      tags: [read]
      operationId: patchSeat
      summary: Set a seat's label, colour, order or hidden flag
      description: |
        desktop.md C10 (phase 6). `null` clears `label` or `colour`; a missing key leaves it.
        Sets `seat.look_src = 'ui'`, so a later `slot_info` label or colour no longer applies
        (record.md 4.7). Publishes a `usage` stream event.
      x-scopes: [owner]
      parameters:
        - {name: seat, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SeatPatch"}
      responses:
        "200":
          description: The seat after the change.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Seat"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}

  /v1/seats/order:
    put:
      tags: [read]
      operationId: putSeatOrder
      summary: Set the order of the accounts (drag and drop on the Accounts page)
      description: |
        pwa.md Accounts. The owner's order of the seats, the same on every device. The listed
        seats come first in the order given; seats not listed (hidden ones, or one that
        appeared after the caller last looked) follow in their current order, so a partial
        list is allowed and an empty list only renumbers. Every id must name a seat and none
        may repeat (400 otherwise, and nothing changes; at most 500 ids). The hub renumbers
        `seat.sort_order` 0..n-1 (the `order` of `Seat`), so positions are unique afterwards.
        A new seat sorts after every seat already ordered. `GET /v1/accounts`,
        `GET /v1/overview` and the stream all list seats by `order`, then by first sight.
        Publishes a `seats` stream event with every seat id in the new order, so open boards,
        the desktop app and the phone's next refresh show it with no reload.
      x-scopes: [owner]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids:
                  type: array
                  maxItems: 500
                  items: {type: string}
              additionalProperties: false
      responses:
        "200":
          description: Every seat (hidden ones too), in the new order.
          content:
            application/json:
              schema:
                type: object
                required: [accounts]
                properties:
                  accounts:
                    type: array
                    items: {$ref: "#/components/schemas/Seat"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}

  /v1/accounts/{seat}/windows:
    get:
      tags: [read]
      operationId: seatWindows
      summary: Limit window history for one seat
      x-scopes: [read]
      parameters:
        - name: seat
          in: path
          required: true
          schema: {type: string}
        - name: key
          in: query
          description: Window key(s), comma-separated. Default all.
          schema: {type: string}
        - name: since
          in: query
          schema: {type: string, format: date-time}
        - name: samples
          in: query
          description: Include raw samples (for charts), not only windows.
          schema: {type: boolean, default: false}
      responses:
        "200":
          description: Windows, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [windows]
                properties:
                  windows:
                    type: array
                    items: {$ref: "#/components/schemas/Window"}
                  samples:
                    type: array
                    items: {$ref: "#/components/schemas/LimitSample"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}

  /v1/machines:
    get:
      tags: [read]
      operationId: listMachines
      summary: Machines with last seen, backlog and version
      description: Phase 5 adds the fields of machines.md 6.1 and `all`.
      x-scopes: [read]
      parameters:
        - {name: all, in: query, required: false, schema: {type: boolean, default: false}, description: "Include removed machines (with `removed_at`); phase 5."}
      responses:
        "200":
          description: Machines and their slots.
          content:
            application/json:
              schema:
                type: object
                required: [machines]
                properties:
                  machines:
                    type: array
                    items: {$ref: "#/components/schemas/Machine"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}

  /v1/machines/{id}:
    patch:
      tags: [read]
      operationId: patchMachine
      summary: Rename a machine
      description: machines.md 6.2 (phase 5).
      x-scopes: [owner]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/MachinePatch"}
      responses:
        "200":
          description: The machine after the change.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Machine"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
    delete:
      tags: [read]
      operationId: removeMachine
      summary: Remove a machine from the board (history stays)
      description: |
        machines.md 6.2 (phase 5). Sets `removed_at`, revokes every device bound to the machine
        (the pull device included), disables its pull target and closes its open alerts.
        `409` when it is the machine the caller's own device is bound to.
      x-scopes: [owner]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        "204": {description: Removed.}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}

  /v1/machines/{id}/pull:
    post:
      tags: [read]
      operationId: pullMachineNow
      summary: Pull a machine now (pull targets only)
      description: |
        machines.md 6.2 (phase 5). Sets the target's `next_at` to now. `404` without a pull
        target; `409` while the target is in `host_key` or `refused` state.
      x-scopes: [owner]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        "202":
          description: Accepted; the pull runs shortly.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PullStatus"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}

  /v1/push/direct-policy:
    get:
      tags: [read]
      operationId: directPushPolicy
      summary: The hub's push rules resolved for the calling machine (direct push)
      description: machines.md 5.3 (phase 5). `403` for a device without a machine.
      x-scopes: [write]
      responses:
        "200":
          description: The resolved policy.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DirectPolicy"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}

  /v1/stream:
    get:
      tags: [live]
      operationId: stream
      summary: Live changes (server-sent events)
      description: |
        `text/event-stream`. Each message has `id` (a hub-wide increasing integer), `event`
        (one of `StreamEventType`) and `data` (one JSON object, schema per type below).

        - On connect the hub sends `hello`. If `Last-Event-ID` is given and still in the
          hub's buffer (last 10 minutes or 5000 events), missed events follow; otherwise it
          sends `reset`, and the client refetches `/v1/overview`.
        - `ping` every 25 seconds keeps proxies from closing the connection. The hub checks
          the device on every ping and closes the stream when it was revoked (or its board
          session expired). Otherwise the hub never ends a stream: its HTTP server has no
          read or write timeout, each write has its own 30-second deadline.
        - The live status of a client is the stream's alone: a failed read (a 404 for a
          deleted session) says nothing about it.
        - Browsers cannot set headers on `EventSource`, so the token may also be given as
          `?token=` on this endpoint only (the web board uses its `sy_session` cookie instead, see `/v1/session/login`).
        - `focus_url` in `session` events is sent only to desktop devices on the same
          machine as the terminal (record.md 3.3).
      x-scopes: [read]
      parameters:
        - name: Last-Event-ID
          in: header
          schema: {type: string}
        - name: last_event_id
          in: query
          description: |
            Same as `Last-Event-ID`, for the first connect (an `EventSource` cannot set the
            header). The board passes the `stream_id` of the `/v1/overview` it just fetched,
            so events published between that fetch and the subscription are replayed. The
            header wins when both are given.
          schema: {type: integer, minimum: 0}
        - name: token
          in: query
          schema: {type: string}
        - name: types
          in: query
          description: Comma-separated event types to receive. Default all.
          schema: {type: string}
      responses:
        "200":
          description: Event stream.
          content:
            text/event-stream:
              schema:
                type: string
                description: |
                  Example:

                      id: 4182
                      event: session
                      data: {"session":{"id":"c41e…","state":"asked","needs_you":true,...},"change":"state"}
              x-events:
                hello: {$ref: "#/components/schemas/StreamHello"}
                reset: {$ref: "#/components/schemas/StreamReset"}
                ping: {$ref: "#/components/schemas/StreamPing"}
                session: {$ref: "#/components/schemas/StreamSession"}
                usage: {$ref: "#/components/schemas/StreamUsage"}
                machine: {$ref: "#/components/schemas/StreamMachine"}
                alert: {$ref: "#/components/schemas/StreamAlert"}
                seats: {$ref: "#/components/schemas/StreamSeats"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}

  # ------------------------------------------------------------------ analytics (analytics.md)

  /v1/analytics/{report}:
    get:
      tags: [read]
      operationId: analytics
      summary: Tokens, API-equivalent cost, models, projects, heatmap, sessions, limit windows and hits
      description: |
        The prototype's analytics on the hub (analytics.md). Token reports sum `token_row` and
        price it at API list prices (`api_usd`: a yardstick, not a bill). A day is a day of the
        hub's time zone. The reply is the schema named after the report.
      x-scopes: [read]
      parameters:
        - name: report
          in: path
          required: true
          schema: {type: string, enum: [daily, models, projects, heatmap, sessions, limits, hits]}
        - name: from
          in: query
          description: First day, `YYYY-MM-DD`, hub time zone. Default `days` - 1 days before `to`.
          schema: {type: string, format: date}
        - name: to
          in: query
          description: Last day, inclusive. Default today. At most 366 days from `from`.
          schema: {type: string, format: date}
        - name: days
          in: query
          description: Length of the range when `from` is not given, 1-366. Default 30.
          schema: {type: integer, minimum: 1, maximum: 366, default: 30}
        - name: seat
          in: query
          description: One seat id, or `unattributed` for rows with no seat. Default every seat.
          schema: {type: string}
        - name: tz
          in: query
          description: >-
            The zone days and hours are counted in (IANA name, such as the viewer's
            `Intl.DateTimeFormat().resolvedOptions().timeZone`); `from` and `to` are read in it and
            the head's `tz` echoes it. Default the hub's time zone. Not a zone the hub knows: 400.
          schema: {type: string}
      responses:
        "200":
          description: The report.
          content:
            application/json:
              schema:
                oneOf:
                  - {$ref: "#/components/schemas/AnalyticsDaily"}
                  - {$ref: "#/components/schemas/AnalyticsModels"}
                  - {$ref: "#/components/schemas/AnalyticsProjects"}
                  - {$ref: "#/components/schemas/AnalyticsHeatmap"}
                  - {$ref: "#/components/schemas/AnalyticsSessions"}
                  - {$ref: "#/components/schemas/AnalyticsLimits"}
                  - {$ref: "#/components/schemas/AnalyticsHits"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404":
          description: Unknown report or seat.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}

  # ------------------------------------------------------------------ phase 4: pairing, devices, pushes
  # Each operation below keeps `x-reserved: phase 4` (501) until its work package implements
  # it (docs/phases/4.md); the shapes are final. Specs: pairing.md, push.md, pwa.md.

  /v1/me:
    get:
      tags: [devices]
      operationId: me
      summary: Who is calling (device, scopes, owner)
      description: The web app calls this at start to choose between the pair screen, the
        read-only board and owner settings (pairing.md 6).
      x-scopes: [read, write, push, owner]
      responses:
        "200":
          description: The caller.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Me"}
        "401": {$ref: "#/components/responses/Unauthorized"}

  /v1/session/owner:
    post:
      tags: [meta]
      operationId: ownerSignIn
      summary: Swap a one-time owner link secret for an owner session cookie
      description: |
        The secret comes from `sy hub owner-link`, from `POST /v1/owner-links` on an owner
        device, or from the first-start link of `sy hub serve` (pairing.md 4.1). On success the
        hub makes a `browser` device with scopes `owner`, `read`, `push`, expiring in 30 days,
        and sets it as the `sy_session` cookie. Used in its last 7 days, the session slides to
        30 days from then (pairing.md 4). A refused secret is `401` with `code` = `link_used`,
        `link_expired`, `link_cancelled` or `link_unknown`, `at` and `ttl_s` (pairing.md 4). Rate
        limited as `/v1/pair/claim`.
      security: []
      x-scopes: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [secret]
              properties:
                secret: {type: string, minLength: 22, maxLength: 64}
                name: {type: string, maxLength: 60}
      responses:
        "204": {description: Signed in as owner; cookie set.}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401":
          description: The link is used, expired, cancelled or unknown.
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: "#/components/schemas/Error"}
                  - type: object
                    properties:
                      code: {enum: [link_used, link_expired, link_cancelled, link_unknown]}
                      at: {type: string, format: date-time, description: "When it was used, expired or was cancelled; absent for link_unknown."}
                      ttl_s: {type: integer, minimum: 1, description: "The lifetime the link was made with (`sy hub owner-link --ttl`), so the board can say how long links work; absent for link_unknown."}
        "429": {$ref: "#/components/responses/TooMany"}

  /v1/owner-links:
    post:
      tags: [pairing]
      operationId: makeOwnerLink
      summary: Make a one-time owner link for another device (Make another device owner)
      description: |
        pairing.md 4.1. Owner sessions only. The link is a `pair_code` of kind `owner`, works
        once for 10 minutes (the `pair.ttl_s` setting does not apply) and is consumed by
        `POST /v1/session/owner` exactly as one from `sy hub owner-link`. At most 3 links made
        this way are live; a fourth cancels the oldest. `url` defaults to `hub.public_url`,
        else the origin of this request. Rate limited per client IP as `/v1/pair/claim`. The
        hub logs one line with the code id and the maker, never the secret. Poll
        `GET /v1/pair/codes/{id}` for `claimed`; `DELETE /v1/pair/codes/{id}` cancels it.
      x-scopes: [owner]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                url: {type: string, format: uri}
      responses:
        "201":
          description: The link. `url` (which holds the secret) is shown only in this reply.
          content:
            application/json:
              schema:
                type: object
                required: [id, url, expires_at, qr]
                properties:
                  id: {type: string}
                  url: {type: string, description: "<hub>/#/owner?s=<secret>"}
                  expires_at: {type: string, format: date-time}
                  qr:
                    type: object
                    description: QR module matrix of `url`, as PairCode's.
                    required: [size, rows]
                    properties:
                      size: {type: integer}
                      rows:
                        type: array
                        items: {type: string, pattern: "^[01]+$"}
        "400":
          description: Malformed request, or (code `needs_https`) a plain http address that is not loopback.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "429": {$ref: "#/components/responses/TooMany"}

  /v1/pair/codes:
    post:
      tags: [pairing]
      operationId: makePairCode
      summary: Make a one-time pairing code (10 minutes)
      description: |
        pairing.md 2. At most 5 live codes; a sixth cancels the oldest. `url` defaults to
        `hub.public_url`, else the origin of this request. Phone and browser codes need an
        `https` URL: over plain http the answer is 400 with code `needs_https`, whose `error`
        says what the phone needs, the address in use and how to set an https one (open the
        board at the hub's https address, or set `hub.public_url`); show it as is.
      x-scopes: [owner]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind]
              properties:
                kind: {type: string, enum: [machine, desktop, phone, browser]}
                name: {type: string, maxLength: 60}
                machine: {type: string}
                url: {type: string, format: uri}
                ttl_s: {type: integer, minimum: 60, maximum: 3600, default: 600}
      responses:
        "201":
          description: The code. `code`, `secret` and `url` are shown only in this reply.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PairCode"}
        "400":
          description: Malformed request, or (code `needs_https`) a phone or browser code over plain http.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}

  /v1/pair/codes/{id}:
    get:
      tags: [pairing]
      operationId: getPairCode
      summary: Status of a pairing code (the board polls it while the dialog is open)
      x-scopes: [owner]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: Status; never the code or secret.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PairCodeStatus"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
    delete:
      tags: [pairing]
      operationId: cancelPairCode
      summary: Cancel a live pairing code
      x-scopes: [owner]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        "204": {description: "Cancelled (or already claimed, cancelled or expired)."}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}

  /v1/pair/claim:
    post:
      tags: [pairing]
      operationId: claimPairCode
      summary: Swap a pairing code or QR secret for a device token
      description: |
        pairing.md 3. No token: the code or secret is the credential. Unknown, used, cancelled
        and expired codes all get the same `401`. `expect_kind` mismatch: `409`, the code
        stays live. With `cookie: true` (phone and browser codes only) the token is set as the
        `sy_session` cookie and left out of the body.
      security: []
      x-scopes: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PairClaim"}
            example: {secret: "Q2xhdWRlIGlzIG5vdCBoZXJl", name: "iPhone · Safari", cookie: true, expect_kind: phone}
      responses:
        "200":
          description: Device made.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PairClaimReply"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "409": {$ref: "#/components/responses/Conflict"}
        "429": {$ref: "#/components/responses/TooMany"}

  /v1/devices:
    get:
      tags: [devices]
      operationId: listDevices
      summary: Machines, desktop apps, phones, browsers and owner sessions
      x-scopes: [owner]
      parameters:
        - {name: all, in: query, description: Include revoked and expired devices., schema: {type: boolean, default: false}}
      responses:
        "200":
          description: Devices, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [devices]
                properties:
                  devices:
                    type: array
                    items: {$ref: "#/components/schemas/Device"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}

  /v1/devices/{id}:
    get:
      tags: [devices]
      operationId: getDevice
      summary: One device; `self` is the caller
      description: Owner for any id; every other token only for `self`.
      x-scopes: [owner, read, push]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: The device.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Device"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
    patch:
      tags: [devices]
      operationId: updateDevice
      summary: Rename a device or change its push preferences
      description: Owner for any id; push-scoped devices for `self`. `prefs` replaces the whole object (push.md 5.4).
      x-scopes: [owner, push]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: {type: string, minLength: 1, maxLength: 60}
                prefs: {$ref: "#/components/schemas/DevicePrefs"}
      responses:
        "200":
          description: The updated device.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Device"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
    delete:
      tags: [devices]
      operationId: revokeDevice
      summary: Revoke a device (owner), or unpair this phone (`self`)
      description: |
        Sets `revoked_at`, deletes its push targets, cancels its pending deliveries and
        revokes board/owner sessions made from it. Revoking `self` also clears the cookie.
        The owner cannot revoke the session making the request this way (`409`; use sign
        out).
      x-scopes: [owner, push]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        "204": {description: Revoked.}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}

  /v1/push/config:
    get:
      tags: [push]
      operationId: pushConfig
      summary: VAPID public key and which channels are on
      x-scopes: [read, push, owner]
      responses:
        "200":
          description: Push configuration.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PushConfig"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}

  /v1/push/settings:
    put:
      tags: [push]
      operationId: putPushSettings
      summary: Replace the hub-wide push settings (push.md 2)
      x-scopes: [owner]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PushSettings"}
      responses:
        "200":
          description: The stored settings.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PushSettings"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}

  /v1/push/channels/{kind}:
    put:
      tags: [push]
      operationId: putChannel
      summary: Turn a channel kind on or off hub-wide
      description: |
        `link` (push.md 13.6) takes `settings: {urls?, ping_s?}`.
      x-scopes: [owner]
      parameters:
        - {name: kind, in: path, required: true, schema: {type: string, enum: [webpush, ntfy, link]}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/Channel"}
      responses:
        "200":
          description: The channel.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Channel"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}

  /v1/push/targets:
    get:
      tags: [push]
      operationId: listPushTargets
      summary: Push targets (a push-scoped device sees its own; the owner sees all)
      x-scopes: [push, owner]
      responses:
        "200":
          description: Targets.
          content:
            application/json:
              schema:
                type: object
                required: [targets]
                properties:
                  targets:
                    type: array
                    items: {$ref: "#/components/schemas/PushTarget"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
    post:
      tags: [push]
      operationId: addPushTarget
      summary: Register a Web Push subscription or an ntfy topic
      description: |
        Link targets are made by pairing (push.md 13.7), never here.
        `webpush`: upsert by endpoint (a re-subscribing browser re-binds to the caller). The
        endpoint host must be in `webpush_hosts` (push.md 6.6); `p256dh` must be a P-256 point,
        `auth` 16 bytes. `ntfy`: `topic` is generated when omitted; a push-scoped device's
        topic belongs to it, an owner's has no device. Private defaults to true on ntfy.sh. A device
        may name only an https ntfy server on a public address (the owner may name private and
        tailnet servers) and may hold at most 10 targets (409).
      x-scopes: [push, owner]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PushTargetNew"}
            example:
              kind: webpush
              endpoint: "https://web.push.apple.com/QGz…"
              keys: {p256dh: "BNcR…", auth: "tBHI…"}
              name: "iPhone · Safari"
      responses:
        "201":
          description: Registered (or re-bound).
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PushTarget"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}

  /v1/push/targets/{id}:
    patch:
      tags: [push]
      operationId: updatePushTarget
      summary: Enable, disable, rename a target; prefs of a device-less target
      x-scopes: [push, owner]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled: {type: boolean}
                name: {type: string, maxLength: 60}
                prefs: {$ref: "#/components/schemas/DevicePrefs"}
      responses:
        "200":
          description: The target.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PushTarget"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
    delete:
      tags: [push]
      operationId: deletePushTarget
      summary: Remove a target (own, or any for the owner)
      x-scopes: [push, owner]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        "204": {description: Removed.}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}

  /v1/push/targets/{id}/test:
    post:
      tags: [push]
      operationId: testPushTarget
      summary: Send a test push now and return the push service's answer
      description: Ignores rules, quiet hours and mutes. At most one per 5 seconds per target (`429`). Not written to the alert log.
      x-scopes: [push, owner]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: Result of the attempt (also when the push service refused it).
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PushTestResult"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "429": {$ref: "#/components/responses/TooMany"}

  /v1/rules:
    get:
      tags: [alerts]
      operationId: listRules
      summary: Rules and hub-wide push settings
      x-scopes: [read, push, owner]
      responses:
        "200":
          description: Base rules first (fixed trigger order), then overrides.
          content:
            application/json:
              schema:
                type: object
                required: [rules, settings]
                properties:
                  rules:
                    type: array
                    items: {$ref: "#/components/schemas/Rule"}
                  settings: {$ref: "#/components/schemas/PushSettings"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
    post:
      tags: [alerts]
      operationId: addRule
      summary: Add an override (push.md 3.4)
      x-scopes: [owner]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RuleInput"}
      responses:
        "201":
          description: The override.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Rule"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409":
          description: "duplicate_rule: another rule of the trigger has the same scope (push.md 3.7); `rule` is its id."
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: "#/components/schemas/Error"}
                  - type: object
                    properties:
                      rule: {type: string, description: The id of the rule with that scope.}

  /v1/rules/{id}:
    put:
      tags: [alerts]
      operationId: putRule
      summary: Change a base rule or an override
      description: For base rules only `enabled`, `delay_s`, `bypass_quiet` and `scope.windows` may change; `trigger` never.
      x-scopes: [owner]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RuleInput"}
      responses:
        "200":
          description: The rule.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Rule"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409":
          description: "duplicate_rule: another rule of the trigger has the same scope (push.md 3.7); `rule` is its id."
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: "#/components/schemas/Error"}
                  - type: object
                    properties:
                      rule: {type: string, description: The id of the rule with that scope.}
    delete:
      tags: [alerts]
      operationId: deleteRule
      summary: Delete an override (base rules can only be disabled, `409`)
      x-scopes: [owner]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        "204": {description: Deleted.}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}

  /v1/alerts:
    get:
      tags: [alerts]
      operationId: listAlerts
      summary: Recent pushes (the alert log), newest first
      description: |
        The "recent pushes" log of plan section 16 phase 4. Every alert with its outcome and
        deliveries, including cancelled ones ("you answered first"). `baseline` rows are left
        out unless `status=skipped&reason=baseline`.
      x-scopes: [read, push, owner]
      parameters:
        - {name: status, in: query, description: Comma-separated alert statuses., schema: {type: string}}
        - {name: session, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
        - {name: cursor, in: query, description: Opaque `next` value., schema: {type: string}}
      responses:
        "200":
          description: One page.
          content:
            application/json:
              schema:
                type: object
                required: [alerts]
                properties:
                  alerts:
                    type: array
                    items: {$ref: "#/components/schemas/Alert"}
                  next: {type: [string, "null"]}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}

  /v1/alerts/{id}:
    get:
      tags: [alerts]
      operationId: getAlert
      summary: One alert with its deliveries (private push links resolve through this)
      x-scopes: [read, push, owner]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: The alert.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Alert"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}

  /v1/alerts/{id}/snooze:
    post:
      tags: [alerts]
      operationId: snoozeAlert
      summary: Snooze an alert (default 15 minutes); push again if still open
      description: Allowed in `pending`, `fired`, `snoozed`; otherwise `409` (push.md 4).
      x-scopes: [push, owner]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                minutes: {type: integer, minimum: 5, maximum: 240}
      responses:
        "200":
          description: The alert after snoozing.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Alert"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "503": {$ref: "#/components/responses/Unavailable"}

  /v1/alerts/{id}/seen:
    post:
      tags: [alerts]
      operationId: seenAlert
      summary: Mark an alert seen; no more pushes for this episode
      x-scopes: [push, owner]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: The alert after marking it seen.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Alert"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "503": {$ref: "#/components/responses/Unavailable"}

  /v1/actions/{token}:
    post:
      tags: [alerts]
      operationId: alertAction
      summary: Snooze or Seen from a push button (signed one-time action token)
      description: |
        push.md 8. The token is the only credential; it names the alert, the action, the
        fire it belongs to and an expiry (24 h). Snooze applies at most once per fire
        (`applied: false` otherwise). Only POST: link previews must never act.
      security: []
      x-scopes: []
      parameters:
        - {name: token, in: path, required: true, schema: {type: string, pattern: "^a1\\.[A-Za-z0-9_-]+\\.[A-Za-z0-9_-]+$"}}
      responses:
        "200":
          description: Done (or nothing to do).
          content:
            application/json:
              schema:
                type: object
                required: [alert, applied]
                properties:
                  alert: {$ref: "#/components/schemas/AlertBrief"}
                  applied: {type: boolean}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "410": {$ref: "#/components/responses/Gone"}
        "429": {$ref: "#/components/responses/TooMany"}

  # ------------------------------------------------------------------ F1 / N1 / PE1: keys, link, peers, app updates
  # keys.md, link.md, peers.md, push.md 13-14, phone.md P16. Each operation keeps its
  # `x-reserved` (501) until its phase builds it; the shapes are final.

  /v1/link:
    get:
      tags: [link]
      operationId: link
      summary: The device link (WebSocket, subprotocol sy-link.1)
      description: |
        link.md. A WebSocket upgrade with `Sec-WebSocket-Protocol: sy-link.1`. No bearer:
        the device logs in with a signed `hello` answering the hub's `challenge` (link.md 3).
        Frames, acks, close codes: link.md 4-8. `Origin`, when sent, must be the hub's own.
      security: []
      x-scopes: []
      responses:
        "101": {description: Switching to the WebSocket protocol.}
        "400": {$ref: "#/components/responses/BadRequest"}
        "426": {description: Missing or unknown subprotocol.}
        "429": {$ref: "#/components/responses/TooMany"}
        "503": {$ref: "#/components/responses/Unavailable"}

  /v1/link/poll:
    post:
      tags: [link]
      operationId: linkPoll
      summary: Long-poll fallback for the link
      description: |
        link.md 2.1. `op: challenge` returns the challenge frame itself (link.md 3.1, not
        wrapped); `op: poll` carries a signed `hello`, the cumulative ack and device frames,
        and is held up to 25 s while nothing is queued. Each reply carries the next challenge.
        No bearer. A refused login answers the HTTP form of its close code: 401 (4401), 403
        (4403 revoked), 426 (4426), 429 (4429), 503 (4503 frozen, or the hub shutting down).
      security: []
      x-scopes: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/LinkPollRequest"}
      responses:
        "200":
          description: Frames for the device, results and the next challenge.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/LinkPollReply"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "426": {description: The hub needs a newer client (4426).}
        "429": {$ref: "#/components/responses/TooMany"}
        "503": {$ref: "#/components/responses/Unavailable"}

  /v1/keys:
    get:
      tags: [keys]
      operationId: getKeys
      summary: The hub key, the active owner key and (owner) pending proposals
      x-scopes: [owner, read, push, write]
      responses:
        "200":
          description: Keys.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/KeysInfo"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "501": {$ref: "#/components/responses/NotImplemented"}

  /v1/keys/owner:
    post:
      tags: [keys]
      operationId: proposeOwnerKey
      summary: Propose an owner key (self-signed `owner_key` document)
      description: |
        keys.md 3.3. A proposal is `pending` until an owner session (or `sy hub keys
        confirm-owner`) confirms it; the hub then adds its own signature. Confirming a
        proposal while a key is active retires that key (a replacement, keys.md 3.3 step 5):
        machines keep their pin until `sy keys trust-owner` is run on each. `409` while
        another proposal is pending.
      x-scopes: [owner, write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [doc]
              properties:
                doc: {$ref: "#/components/schemas/SignedDoc"}
      responses:
        "201":
          description: "Stored as pending (there is no rotation document, keys.md 3.3 step 5; merged mode activates through the CLI, not this endpoint)."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/OwnerKey"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
        "501": {$ref: "#/components/responses/NotImplemented"}

  /v1/keys/owner/confirm:
    post:
      tags: [keys]
      operationId: confirmOwnerKey
      summary: Activate a pending owner key (owner session)
      x-scopes: [owner]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fp]
              properties:
                fp: {type: string, pattern: "^[a-z2-7]{24}$"}
      responses:
        "200":
          description: Active.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/OwnerKey"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "501": {$ref: "#/components/responses/NotImplemented"}

  /v1/keys/revocations:
    get:
      tags: [keys]
      operationId: getRevocations
      summary: The newest revocation document
      x-scopes: [owner, read, push, write]
      responses:
        "200":
          description: "The document (wire form, keys.md 6); doc is null when nothing was revoked."
          content:
            application/json:
              schema:
                type: object
                required: [doc]
                properties:
                  doc:
                    oneOf:
                      - {$ref: "#/components/schemas/SignedDoc"}
                      - {type: "null"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "501": {$ref: "#/components/responses/NotImplemented"}
    post:
      tags: [keys]
      operationId: postRevocations
      summary: Upload an owner-signed revocation document; the hub revokes the devices it adds
      x-scopes: [owner, write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [doc]
              properties:
                doc: {$ref: "#/components/schemas/SignedDoc"}
      responses:
        "200":
          description: Accepted and queued to every machine; `revoked` lists the devices this upload revoked.
          content:
            application/json:
              schema:
                type: object
                required: [revoked]
                properties:
                  revoked:
                    type: array
                    items: {type: string}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "409": {$ref: "#/components/responses/Conflict"}
        "501": {$ref: "#/components/responses/NotImplemented"}

  /v1/devices/{id}/keys:
    put:
      tags: [keys]
      operationId: putDeviceKeys
      summary: Register a device's link keys (devices paired before F1, or new keys)
      description: |
        keys.md 4.2, push.md 13.7. `self` for machines (`write`) and phones (`push`); the hub
        signs the certificate (`reg: tofu`) and, for a phone, makes its `link` target. New keys
        replace the old certificate and are added to the next revocation list; `409` for a
        device whose keys came under the QR seal or SSH, or that the owner key certified
        (re-pair it instead).
      x-scopes: [write, push]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/DeviceKeysNew"}
      responses:
        "200":
          description: The hub-signed certificate.
          content:
            application/json:
              schema:
                type: object
                required: [cert]
                properties:
                  cert: {$ref: "#/components/schemas/SignedDoc"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
        "501": {$ref: "#/components/responses/NotImplemented"}

  /v1/devices/{id}/cert:
    get:
      tags: [keys]
      operationId: getDeviceCert
      summary: A device's certificate with its signatures
      x-scopes: [owner, write]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: The certificate.
          content:
            application/json:
              schema:
                type: object
                required: [cert, owner_signed]
                properties:
                  cert: {$ref: "#/components/schemas/SignedDoc"}
                  owner_signed: {type: boolean}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "501": {$ref: "#/components/responses/NotImplemented"}
    post:
      tags: [keys]
      operationId: certifyDevice
      summary: Add the owner signature to a device certificate (`sy keys certify`)
      description: keys.md 4.2 step 2. The signature must verify with the active owner key over the stored body.
      x-scopes: [owner, write]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fp, sig]
              properties:
                fp: {type: string, pattern: "^[a-z2-7]{24}$"}
                sig: {type: string, pattern: "^[A-Za-z0-9_-]{86}$"}
      responses:
        "200": {description: Certified.}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "501": {$ref: "#/components/responses/NotImplemented"}

  /v1/peers:
    get:
      tags: [peers]
      operationId: listPeers
      summary: Live sessions and whether peers can reach them (board, desktop, phone)
      description: |
        peers.md 3. For viewers. Machines read the directory over the link (`peers_list`),
        so machine tokens stay write-only.
      x-scopes: [owner, read]
      responses:
        "200":
          description: Sessions.
          content:
            application/json:
              schema:
                type: object
                required: [sessions]
                properties:
                  sessions:
                    type: array
                    items: {$ref: "#/components/schemas/PeerSession"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "501": {$ref: "#/components/responses/NotImplemented"}

  /v1/peers/matrix:
    get:
      tags: [peers]
      operationId: getMatrix
      summary: The newest matrix document and its decoded body
      x-scopes: [owner, read, push, write]
      responses:
        "200":
          description: The matrix.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MatrixInfo"}
        "401": {$ref: "#/components/responses/Unauthorized"}
    put:
      tags: [peers]
      operationId: putMatrix
      summary: A new matrix version (owner-signed document, or an edit the hub signs)
      description: |
        peers.md 5.4, keys.md 5. `doc`: an owner-signed `matrix` document, version = current + 1,
        accepted from any caller with one of the scopes. `edit`: the hub builds and signs the
        next version; an edit that widens (keys.md 5.2) needs the `owner` scope (`403`
        otherwise), a narrowing edit is accepted from any of the scopes.
      x-scopes: [owner, push, write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                doc: {$ref: "#/components/schemas/SignedDoc"}
                edit: {$ref: "#/components/schemas/MatrixEdit"}
              oneOf:
                - {required: [doc]}
                - {required: [edit]}
      responses:
        "200":
          description: The new matrix.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MatrixInfo"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}

  /v1/peers/pause:
    post:
      tags: [peers]
      operationId: pausePeers
      summary: Pause all peers (any device) or resume (owner)
      description: peers.md 11. Shorthand for a matrix edit of `paused`; resuming widens, so it needs `owner`.
      x-scopes: [owner, push, write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [paused]
              properties:
                paused: {type: boolean}
      responses:
        "200":
          description: The new matrix.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MatrixInfo"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}

  /v1/peers/threads/{id}/resume:
    post:
      tags: [peers]
      operationId: resumePeerThread
      summary: Clear a thread's loop-guard stop (owner)
      description: >-
        peers.md 6.3. Resets the hub's own loop guard for the thread (turns 0, paused_at
        cleared), writes a `thread_resume` audit row and queues `peer_thread_resume` (link.md
        6.4) to the agent of each machine in the thread, offline ones included. The hub signs
        it, so it widens: a machine with `hub_may_widen = false` refuses it (keys.md 5.4) and
        keeps its own stop until a human prompt in either session. Such a machine reports the
        refusal (link.md 6.2 `peer_log` event); the hub then writes a `thread_resume_refused`
        audit row (detail `machine`) and marks the thread paused again.
      x-scopes: [owner]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, pattern: "^t_[0-9a-f]{16}$"}}
      responses:
        "200":
          description: Resumed at the hub; the machines are told.
          content:
            application/json:
              schema:
                type: object
                required: [thread, was_paused, machines]
                properties:
                  thread: {type: string}
                  was_paused: {type: boolean, description: "The hub's loop guard had stopped the thread."}
                  machines: {type: integer, minimum: 0, description: "Agents the resume was queued for."}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "503": {$ref: "#/components/responses/Unavailable"}

  /v1/peers/messages:
    get:
      tags: [peers]
      operationId: listPeerMessages
      summary: Peer message metadata (who, when, size, status; never text)
      x-scopes: [owner, read]
      parameters:
        - {name: since, in: query, schema: {type: string, format: date-time}}
        - {name: thread, in: query, schema: {type: string}}
        - {name: session, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 500, default: 100}}
      responses:
        "200":
          description: Messages, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [messages]
                properties:
                  messages:
                    type: array
                    items: {$ref: "#/components/schemas/PeerMessage"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "501": {$ref: "#/components/responses/NotImplemented"}

  /v1/peers/audit:
    get:
      tags: [peers]
      operationId: listPeerAudit
      summary: Matrix changes, pauses, loop-guard stops and refusals
      x-scopes: [owner, read]
      parameters:
        - {name: since, in: query, schema: {type: string, format: date-time}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 500, default: 100}}
      responses:
        "200":
          description: Audit entries, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [entries]
                properties:
                  entries:
                    type: array
                    items: {$ref: "#/components/schemas/PeerAuditEntry"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}

  /v1/app/android:
    get:
      tags: [app]
      operationId: getAndroidRelease
      summary: The mirrored Android app release (updater manifest)
      description: phone.md P16.2. `404` when nothing is mirrored.
      x-scopes: [owner, read, push]
      responses:
        "200":
          description: The manifest.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AndroidRelease"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}

  /v1/app/android/apk:
    get:
      tags: [app]
      operationId: getAndroidApk
      summary: The mirrored APK, unchanged
      x-scopes: [owner, read, push]
      responses:
        "200":
          description: The APK; `ETag` is its SHA-256.
          content:
            application/vnd.android.package-archive:
              schema: {type: string, contentMediaType: application/vnd.android.package-archive}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: "sy_<kind>_<43 base62> (tokens.md)"
    cookie:
      type: apiKey
      in: cookie
      name: sy_session
      description: |
        The web app's cookie (board login, phone pairing in cookie mode, owner session). A
        cookie request that changes state must send `Content-Type: application/json` and, if
        it sends `Origin`, the hub's own origin (pairing.md 3.2).

  responses:
    BadRequest:
      description: Malformed request.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    Unauthorized:
      description: |
        Missing, unknown or revoked token. When the token belongs to a device that was
        revoked or has expired, `reason` says which (pairing.md 4, 6), so the board can say
        "This browser was removed from the hub." or "Your owner access ended.".
      content:
        application/json:
          schema:
            allOf:
              - {$ref: "#/components/schemas/Error"}
              - type: object
                properties:
                  reason: {type: string, enum: [revoked, expired, owner_expired]}
    Forbidden:
      description: Token lacks the scope.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    NotFound:
      description: No such item.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    TooMany:
      description: Rate limited. `Retry-After` header in seconds.
      headers:
        Retry-After:
          schema: {type: integer}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    Unavailable:
      description: Hub is starting, migrating or the database is busy. Retry later.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    Conflict:
      description: The request conflicts with the item's state (wrong kind, wrong status, base rule).
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    Gone:
      description: Expired (action token).
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    NotImplemented:
      description: Reserved; not implemented in this phase.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}

  schemas:
    Error:
      type: object
      required: [error, code]
      properties:
        error: {type: string, description: Human-readable message.}
        code:
          type: string
          enum: [bad_request, unauthorized, forbidden, machine_mismatch, not_found, conflict, gone, too_large, rate_limited, unavailable, not_implemented, internal,
            link_used, link_expired, link_cancelled, link_unknown, duplicate_rule, needs_https]

    Health:
      type: object
      required: [ok, version, schema]
      properties:
        ok: {type: boolean}
        version: {type: string, description: Hub (sy) version.}
        schema: {type: integer, description: Database schema version.}
        time: {type: string, format: date-time}
        ui: {type: string, description: "Build hash of the embedded web app (pwa.md 4); phase 4."}
        record_v_max: {type: integer, description: "Highest record `v` this hub types (machines.md 7.2); phase 5. Absent means 1."}
        batch_v:
          type: array
          description: Upload batch versions this hub accepts; phase 5.
          items: {type: integer}
        drain_proto: {type: integer, description: "Drain protocol version this hub speaks (machines.md 3.5); phase 5."}
        frozen:
          type: object
          description: "Present while the hub is frozen for a move (machines.md 8.1); informational, clients never follow it."
          required: [since]
          properties:
            since: {type: string, format: date-time}
            moved_to: {type: [string, "null"]}

    # ---------------------------------------------------------------- records (record.md)

    Batch:
      type: object
      required: [v, records]
      properties:
        v: {type: integer, const: 1}
        client: {type: string, description: "name/semver of the uploader"}
        records:
          type: array
          minItems: 1
          maxItems: 1000
          items: {$ref: "#/components/schemas/Record"}
      additionalProperties: true

    Record:
      type: object
      description: The envelope. See record.md section 3. Unknown fields are stored, never refused.
      required: [v, id, kind, ts, machine, payload]
      properties:
        v: {type: integer, minimum: 1}
        id: {type: string, pattern: "^[0-9A-Za-z_-]{16,64}$"}
        kind:
          type: string
          pattern: "^[a-z][a-z0-9_]{0,39}$"
          description: "hook_event, limit_sample, web_usage, token_rows, session_list, history_import, slot_info, or a future kind."
          examples: [hook_event, limit_sample, web_usage, token_rows, session_list, history_import, slot_info]
        ts: {type: string, format: date-time}
        machine: {type: string, pattern: "^m_[0-9A-HJKMNP-TV-Z]{26}$"}
        slot: {type: string}
        seat: {$ref: "#/components/schemas/SeatRef"}
        term: {$ref: "#/components/schemas/Term"}
        client: {type: string}
        redacted:
          type: array
          items: {type: string}
        derived:
          type: object
          additionalProperties: true
        payload:
          type: object
          additionalProperties: true
      additionalProperties: true

    SeatRef:
      type: object
      required: [account, org]
      properties:
        account: {type: string, description: "Account uuid; empty string when only auth status was available (identity.md 4)."}
        org: {type: string}
        email: {type: string}
        src: {type: string, enum: [claude_json, auth_status, claude_ai]}
      additionalProperties: true

    Term:
      type: object
      required: [app]
      properties:
        app: {type: string}
        id: {type: string}
        focus_url: {type: string}
        host: {type: string}
      additionalProperties: true

    IngestReply:
      type: object
      required: [accepted, rejected]
      properties:
        accepted:
          type: array
          description: Ids stored now or already stored from this device.
          items: {type: string}
        duplicates:
          type: array
          description: Subset of `accepted` that was already stored.
          items: {type: string}
        rejected:
          type: array
          items:
            type: object
            required: [id, reason]
            properties:
              id: {type: string}
              reason:
                type: string
                enum: [bad_id, bad_envelope, machine_mismatch, id_conflict, too_large]
              detail: {type: string}
        hub:
          type: object
          description: "What the hub reads (machines.md 7.2); phase 5. Absent from older hubs, which read record v 1."
          properties:
            version: {type: string}
            record_v_max: {type: integer}

    # ---------------------------------------------------------------- read models

    SessionState:
      type: string
      enum: [working, needs_permission, asked, done, failed, ended, gone]

    Session:
      type: object
      required: [id, state, needs_you, state_since]
      properties:
        id: {type: string}
        state: {$ref: "#/components/schemas/SessionState"}
        detail: {type: [string, "null"], description: "Reason for the state (states.md 1). `history` with state `ended`: known only from its transcript (states.md 5.1)."}
        needs_you: {type: boolean}
        state_since: {type: [string, "null"], format: date-time, description: "Null when unknown (imported history with no times, states.md 5.1)."}
        question: {type: [string, "null"], description: "Question line, when allowed."}
        last_message: {type: [string, "null"], description: "derived.last_message of the last Stop, when allowed."}
        tool_name: {type: [string, "null"], description: "needs_permission or asked: the tool it waits on (newest PermissionRequest, PreToolUse or Notification since the state began). Null otherwise."}
        notification: {type: [string, "null"], description: "needs_permission or asked: Claude Code's text of the newest Notification since the state began. Null otherwise."}
        seat: {type: [string, "null"], description: Seat id; null = Unattributed.}
        seat_label: {type: [string, "null"]}
        seat_colour: {type: [string, "null"]}
        machine: {type: [string, "null"]}
        machine_name: {type: [string, "null"]}
        slot: {type: [string, "null"], description: "Folder, e.g. ~/.claude-2"}
        project: {type: [string, "null"]}
        cwd: {type: [string, "null"]}
        name: {type: [string, "null"]}
        title: {type: [string, "null"]}
        kind: {type: [string, "null"], enum: [interactive, background, null]}
        model: {type: [string, "null"]}
        context_pct: {type: [number, "null"]}
        started_at: {type: [string, "null"], format: date-time}
        last_event_at: {type: [string, "null"], format: date-time}
        ended_at: {type: [string, "null"], format: date-time}
        remote_url: {type: [string, "null"], description: Remote Control link.}
        resume: {type: [string, "null"], description: "Resume command, e.g. claude-2 --resume <id>"}
        focus_url: {type: [string, "null"], description: Only for a desktop device on the terminal's machine.}
        stale: {type: boolean, description: "Working with no event for 12 h and no session lists (states.md 5)."}
        machine_stale: {type: boolean, description: "Machine silent for 15 min (states.md 5)."}
        dormant: {type: boolean, description: "Open, not needing you, and done with no activity for 12 h or working and stale (states.md 5): not counted in counts.live."}
        activity_at: {type: [string, "null"], format: date-time, description: "Newest of last event, state_since, start and end (not the last listing): what `dormant`, `days` and the order use. Null when nothing is known."}
        alert:
          description: "The open alert of this session's current episode, if any (phase 4, push.md 4)."
          oneOf:
            - {$ref: "#/components/schemas/AlertBrief"}
            - {type: "null"}

    SessionDetail:
      allOf:
        - {$ref: "#/components/schemas/Session"}
        - type: object
          required: [timeline]
          properties:
            timeline:
              type: array
              description: Hook events, oldest first (last 500).
              items:
                type: object
                required: [ts, event]
                properties:
                  ts: {type: string, format: date-time}
                  event: {type: string}
                  subtype: {type: [string, "null"]}
                  tool_name: {type: [string, "null"]}
                  state_after: {type: [string, "null"]}
                  last_message: {type: [string, "null"]}
            transitions:
              type: array
              description: State changes, oldest first (session_transition, schema v2).
              items:
                type: object
                required: [at, to, cause]
                properties:
                  at: {type: string, format: date-time}
                  from: {type: [string, "null"]}
                  to: {type: string}
                  detail: {type: [string, "null"]}
                  cause: {type: string, description: "The hook event name, `session_list` or `gone`."}
            tokens:
              type: object
              description: Totals from token rows.
              properties:
                input: {type: integer}
                output: {type: integer}
                cache_read: {type: integer}
                cache_write: {type: integer}
                replies: {type: integer}
                api_usd: {type: number}

    Seat:
      type: object
      required: [id, account, org]
      properties:
        id: {type: string}
        account: {type: string, description: Account uuid.}
        org: {type: string, description: Org uuid.}
        email: {type: [string, "null"]}
        org_name: {type: [string, "null"]}
        plan: {type: [string, "null"]}
        label: {type: [string, "null"]}
        colour: {type: [string, "null"]}
        order: {type: integer, description: "Display position: seats are listed by it (PUT /v1/seats/order sets it, 0..n-1)."}
        hidden: {type: boolean}
        windows:
          type: array
          description: Current window per key (five_hour, seven_day, per-model weeks, iguana_necktie…).
          items: {$ref: "#/components/schemas/Window"}
        extra_usage: {type: [object, "null"], description: "Raw extra_usage from the newest web_usage, whole."}
        spend: {type: [object, "null"], description: "Raw spend from the newest web_usage, whole."}
        web_raw_at: {type: [string, "null"], format: date-time, description: Time of the newest web_usage.}
        places:
          type: array
          description: Where this seat is used.
          items:
            type: object
            properties:
              machine: {type: string}
              machine_name: {type: string}
              slot: {type: [string, "null"]}
              tab_id: {type: [string, "null"]}
              stopped_reason:
                type: [string, "null"]
                description: "Why the desktop app stopped reading this web seat (web_seat.stopped_reason: 401, 403 or 429); null while reading or for a slot place. Phase 6."
        signed_out:
          type: array
          description: >-
            Claude Code folders that were logged in to this seat and are now logged out: the
            slot's open slot_login period has no seat and the period just before it had this one
            (identity.md 5.2). A folder that moved to another login is that seat's place instead.
            Machine names and folders only, no email. The phone's Accounts card says "signed out
            on <machine>" from it (phone.md P17.7).
          items:
            type: object
            required: [machine, machine_name, slot, since]
            properties:
              machine: {type: string}
              machine_name: {type: string}
              slot: {type: string}
              since: {type: string, format: date-time, description: When the folder was seen logged out.}
        live_sessions: {type: integer}

    Window:
      type: object
      required: [key, resets_at]
      properties:
        key: {type: string}
        label: {type: [string, "null"]}
        used_pct: {type: [number, "null"]}
        peak_pct: {type: [number, "null"]}
        resets_at: {type: string, format: date-time}
        started_at: {type: [string, "null"], format: date-time}
        unused_pct: {type: [number, "null"]}
        source: {type: string, enum: [statusline, web, both]}
        updated_at: {type: [string, "null"], format: date-time}
        pace:
          type: [object, "null"]
          description: Projection at the current rate.
          properties:
            projected_pct: {type: number}
            full_at: {type: [string, "null"], format: date-time}
            band: {type: string, enum: [comfortable, on_track, fast, runaway]}

    LimitSample:
      type: object
      required: [ts, key, source]
      properties:
        ts: {type: string, format: date-time}
        key: {type: string}
        source: {type: string, enum: [statusline, web]}
        used_pct: {type: [number, "null"]}
        resets_at: {type: [string, "null"], format: date-time}

    Machine:
      type: object
      required: [id, name]
      properties:
        id: {type: string}
        name: {type: string, description: "The owner's rename on the board, or the machine's own name once `sy machine rename` changes it (machine_info.name, record.md 4.8)."}
        os: {type: [string, "null"]}
        arch: {type: [string, "null"]}
        sy_version: {type: [string, "null"]}
        last_seen: {type: [string, "null"], format: date-time}
        last_record: {type: [string, "null"], format: date-time}
        backlog: {type: [integer, "null"]}
        silent: {type: boolean, description: No record for 15 minutes while it has live sessions.}
        live_sessions: {type: integer}
        reach:
          type: [string, "null"]
          enum: [direct, forward, pull, null]
          description: "How its records reach the hub (machines.md 3); phase 5."
        backlog_oldest: {type: [string, "null"], format: date-time, description: "Ts of its oldest unanswered record; phase 5."}
        backlog_at: {type: [string, "null"], format: date-time, description: "When backlog was reported; phase 5."}
        version_status:
          type: string
          enum: [same, older, newer, unknown]
          description: "sy_version compared with the hub's version; phase 5."
        record_v: {type: [integer, "null"], description: "Highest record v the machine writes; phase 5."}
        held: {type: integer, description: "Records held back because the hub is too old (machines.md 7.2); phase 5."}
        direct_push: {type: boolean, description: "Direct ntfy is on (machines.md 5); phase 5."}
        timer_ok: {type: [boolean, "null"], description: "Its OS timer runs (sy doctor); phase 5."}
        linger: {type: [boolean, "null"], description: "Linux: loginctl linger on; phase 5."}
        removed_at: {type: [string, "null"], format: date-time, description: "Only with ?all=true; phase 5."}
        pull:
          oneOf:
            - {$ref: "#/components/schemas/PullStatus"}
            - {type: "null"}
        alert:
          oneOf:
            - {$ref: "#/components/schemas/AlertBrief"}
            - {type: "null"}
          description: "The open machine_silent alert, if any; phase 5."
        slots:
          type: array
          items:
            type: object
            properties:
              folder: {type: string}
              launcher: {type: [string, "null"]}
              seat: {type: [string, "null"]}
              logged_in: {type: boolean}
              claude_version: {type: [string, "null"]}

    SeatPatch:
      type: object
      description: "PATCH /v1/accounts/{seat} (desktop.md C10); phase 6. null clears label or colour; a missing key leaves it."
      properties:
        label: {type: [string, "null"], pattern: "^[a-z0-9][a-z0-9-]{0,23}$"}
        colour: {type: [string, "null"], pattern: "^#[0-9a-f]{6}$"}
        order: {type: integer}
        hidden: {type: boolean}
      additionalProperties: false

    MachinePatch:
      type: object
      description: "PATCH /v1/machines/{id} (machines.md 6.2); phase 5."
      properties:
        name: {type: string, minLength: 1, maxLength: 60}
      additionalProperties: false

    PullStatus:
      type: object
      description: "A pull target's health (machines.md 3.4, 6.1); phase 5."
      required: [name, target, interval_s, state]
      properties:
        name: {type: string}
        target: {type: string, description: "user@host[:port], for display."}
        interval_s: {type: integer}
        state: {type: string, enum: [new, ok, failing, host_key, auth, refused, disabled, frozen]}
        last_try: {type: [string, "null"], format: date-time}
        last_ok: {type: [string, "null"], format: date-time}
        last_error: {type: [string, "null"]}
        next_at: {type: [string, "null"], format: date-time}

    DirectPolicyRule:
      type: object
      description: "One resolved rule for direct push; the client takes the first match (machines.md 5.3); phase 5."
      required: [trigger, enabled, delay_s, bypass_quiet, seats, projects]
      properties:
        trigger: {type: string, enum: [needs_permission, asked, failed]}
        enabled: {type: boolean}
        delay_s: {type: integer}
        bypass_quiet: {type: boolean}
        seats:
          type: array
          items:
            type: object
            required: [account, org]
            properties:
              account: {type: string}
              org: {type: string}
        projects:
          type: array
          items: {type: string}

    DirectPolicy:
      type: object
      description: "GET /v1/push/direct-policy (machines.md 5.3); phase 5."
      required: [v, machine, settings, rules]
      properties:
        v: {type: integer, const: 1}
        hub: {type: string}
        public_url: {type: [string, "null"]}
        machine: {type: string}
        settings:
          type: object
          properties:
            quiet_hours: {$ref: "#/components/schemas/QuietHours"}
            skip_remote: {type: boolean}
            max_age_s: {type: integer}
        rules:
          type: array
          items: {$ref: "#/components/schemas/DirectPolicyRule"}

    Overview:
      type: object
      required: [time, seats, needs_you, machines, counts]
      properties:
        time: {type: string, format: date-time}
        seats:
          type: array
          items: {$ref: "#/components/schemas/Seat"}
        needs_you:
          type: array
          description: Sessions with needs_you, oldest first.
          items: {$ref: "#/components/schemas/Session"}
        machines:
          type: array
          items: {$ref: "#/components/schemas/Machine"}
        counts:
          type: object
          properties:
            working: {type: integer}
            needs_you: {type: integer}
            done: {type: integer}
            live: {type: integer, description: "Open sessions that are not dormant (states.md 5); history is never live."}
        stream_id: {type: integer, description: Current stream event id; pass as Last-Event-ID to continue live.}
        tz:
          type: string
          description: >-
            The hub's time zone (IANA name, push.md 2): hub-wide quiet hours, alert text, analytics
            days and anything the board labels "hub time" use it. Show it beside such times.
        tz_source:
          type: string
          enum: [setting, system, utc]
          description: >-
            Where tz came from: the hub.tz setting, the hub machine's own zone ($TZ, else
            /etc/localtime), or utc when neither names a zone.

    # ---------------------------------------------------------------- analytics

    AnalyticsHead:
      type: object
      required: [report, from, to, tz, seat]
      properties:
        report: {type: string, enum: [daily, models, projects, heatmap, sessions, limits, hits]}
        from: {type: string, format: date, description: First day of the range, hub time zone.}
        to: {type: string, format: date, description: Last day, inclusive.}
        tz: {type: string, description: "The zone days and hours are in (IANA name): the `tz` parameter, else the hub's time zone."}
        seat: {type: [string, "null"], description: The seat filter; null = every seat.}

    AnalyticsTokens:
      type: object
      required: [input, output, cache_5m, cache_1h, cache_read, replies, api_usd, unpriced_replies]
      properties:
        input: {type: integer}
        output: {type: integer}
        cache_5m: {type: integer, description: Cache writes, 5-minute.}
        cache_1h: {type: integer, description: Cache writes, 1-hour.}
        cache_read: {type: integer}
        replies: {type: integer, description: API responses (token rows). For a day from history, Claude Code's message count.}
        api_usd: {type: number, description: API list-price equivalent in USD. Unknown models count 0.}
        unpriced_replies: {type: integer, description: Replies of models with no known price; not in api_usd.}

    AnalyticsDaily:
      allOf:
        - {$ref: "#/components/schemas/AnalyticsHead"}
        - type: object
          required: [totals, days, seats]
          properties:
            totals: {$ref: "#/components/schemas/AnalyticsTokens"}
            days:
              type: array
              description: Every day of the range, oldest first, zero-filled.
              items:
                allOf:
                  - {$ref: "#/components/schemas/AnalyticsTokens"}
                  - type: object
                    required: [day, source, total_tokens]
                    properties:
                      day: {type: string, format: date}
                      source:
                        type: string
                        enum: [transcripts, history]
                        description: "`history` for a day before the first token row that has Claude Code's own totals (history_day); then only `total_tokens` and `replies` are set."
                      total_tokens: {type: integer, description: Sum of the five counters; for `history`, the imported total.}
            seats:
              type: array
              description: Totals per seat, dearest first; seat null = Unattributed.
              items:
                allOf:
                  - {$ref: "#/components/schemas/AnalyticsTokens"}
                  - type: object
                    required: [seat, name]
                    properties:
                      seat: {type: [string, "null"]}
                      name: {type: string, description: 'Seat label, else account email; "Unattributed" for null.'}

    AnalyticsModels:
      allOf:
        - {$ref: "#/components/schemas/AnalyticsHead"}
        - type: object
          required: [models]
          properties:
            models:
              type: array
              description: Dearest first.
              items:
                allOf:
                  - {$ref: "#/components/schemas/AnalyticsTokens"}
                  - type: object
                    required: [model, label, priced]
                    properties:
                      model: {type: string, description: 'Model id; "" when the row had none.'}
                      label: {type: string, description: '"Opus 5.5"; unknown ids unchanged.'}
                      priced: {type: boolean, description: "false: no list price is known for the model, so api_usd is 0 and means unknown, not free; show it as a dash (UI audit AN6)."}

    AnalyticsProjects:
      allOf:
        - {$ref: "#/components/schemas/AnalyticsHead"}
        - type: object
          required: [projects]
          properties:
            projects:
              type: array
              description: The 50 dearest.
              items:
                allOf:
                  - {$ref: "#/components/schemas/AnalyticsTokens"}
                  - type: object
                    required: [project, name, sessions, last_ts]
                    properties:
                      project: {type: string, description: 'Project path; "" when unknown.'}
                      name: {type: string, description: 'Last path part, or "(unknown)".'}
                      sessions: {type: integer}
                      last_ts: {type: [string, "null"], format: date-time}

    AnalyticsHeatmap:
      allOf:
        - {$ref: "#/components/schemas/AnalyticsHead"}
        - type: object
          required: [api_usd, replies]
          properties:
            api_usd:
              type: array
              description: 7 weekdays (0 = Sunday) of 24 hours (0-23, hub time zone).
              minItems: 7
              maxItems: 7
              items: {type: array, minItems: 24, maxItems: 24, items: {type: number}}
            replies:
              type: array
              minItems: 7
              maxItems: 7
              items: {type: array, minItems: 24, maxItems: 24, items: {type: integer}}

    AnalyticsSessions:
      allOf:
        - {$ref: "#/components/schemas/AnalyticsHead"}
        - type: object
          required: [sessions]
          properties:
            sessions:
              type: array
              description: The 50 dearest.
              items:
                allOf:
                  - {$ref: "#/components/schemas/AnalyticsTokens"}
                  - type: object
                    required: [session_id, seat, seat_name, project, models, first_ts, last_ts]
                    properties:
                      session_id: {type: string}
                      seat: {type: [string, "null"]}
                      seat_name: {type: string}
                      project: {type: string}
                      models: {type: array, items: {type: string}}
                      first_ts: {type: string, format: date-time}
                      last_ts: {type: string, format: date-time}

    AnalyticsLimits:
      allOf:
        - {$ref: "#/components/schemas/AnalyticsHead"}
        - type: object
          required: [windows]
          properties:
            windows:
              type: array
              description: Limit windows that reset inside the range, oldest first (usage_window).
              items:
                type: object
                required: [seat, seat_name, key, label, started_at, resets_at, peak_pct, final_pct, unused_pct, samples]
                properties:
                  seat: {type: string}
                  seat_name: {type: string}
                  key: {type: string, description: "five_hour, seven_day, weekly_fable, ..."}
                  label: {type: string}
                  started_at: {type: [string, "null"], format: date-time}
                  resets_at: {type: string, format: date-time}
                  peak_pct: {type: [number, "null"]}
                  final_pct: {type: [number, "null"]}
                  unused_pct: {type: [number, "null"]}
                  samples: {type: integer}

    AnalyticsHits:
      allOf:
        - {$ref: "#/components/schemas/AnalyticsHead"}
        - type: object
          required: [hits]
          properties:
            hits:
              type: array
              description: '"You''ve hit your limit" replies, oldest first; one per seat, type and reset time.'
              items:
                type: object
                required: [ts, seat, seat_name, session_id, type, status, resets_at, wait_s]
                properties:
                  ts: {type: string, format: date-time}
                  seat: {type: [string, "null"]}
                  seat_name: {type: string}
                  session_id: {type: string}
                  type: {type: [string, "null"], description: "five_hour, seven_day, ..."}
                  status: {type: [string, "null"]}
                  resets_at: {type: [string, "null"], format: date-time}
                  wait_s: {type: [integer, "null"], description: Seconds from the hit to the reset.}

    # ---------------------------------------------------------------- stream events

    StreamEventType:
      type: string
      enum: [hello, reset, ping, session, usage, machine, alert, seats]

    StreamHello:
      type: object
      required: [version, schema]
      properties:
        version: {type: string}
        schema: {type: integer}
        device: {type: string}

    StreamReset:
      type: object
      properties:
        reason: {type: string, enum: [buffer_expired, hub_restarted]}

    StreamPing:
      type: object
      properties:
        time: {type: string, format: date-time}

    StreamSession:
      type: object
      required: [session, change]
      properties:
        change:
          type: string
          enum: [new, state, update, ended]
          description: "`state` = state changed; `update` = other fields (title, context %, remote link)."
        session: {$ref: "#/components/schemas/Session"}
        previous_state: {type: [string, "null"]}

    StreamUsage:
      type: object
      required: [seat]
      properties:
        seat: {type: string}
        windows:
          type: array
          items: {$ref: "#/components/schemas/Window"}

    StreamMachine:
      type: object
      required: [machine]
      properties:
        machine: {$ref: "#/components/schemas/Machine"}

    StreamSeats:
      type: object
      description: The owner reordered the accounts (PUT /v1/seats/order).
      required: [order]
      properties:
        order:
          type: array
          description: Every seat id (hidden ones too) in the new display order.
          items: {type: string}

    StreamAlert:
      type: object
      description: An alert changed status (phase 4, push.md 4).
      required: [alert, change]
      properties:
        change: {type: string, enum: [created, fired, snoozed, seen, cancelled, closed, skipped]}
        alert: {$ref: "#/components/schemas/AlertBrief"}
        session: {type: [string, "null"]}
        seat: {type: [string, "null"]}
        machine: {type: [string, "null"]}

    # ---------------------------------------------------------------- phase 4: pairing, devices, pushes

    Me:
      type: object
      required: [device, owner, hub]
      properties:
        device: {$ref: "#/components/schemas/Device"}
        owner: {type: boolean, description: The caller holds the owner scope.}
        hub:
          type: object
          properties:
            version: {type: string}
            public_url: {type: [string, "null"]}
        via:
          description: |
            The device this board session was opened from, when it is a session made by
            `/v1/session/login` (that token's device) or an owner session whose link was
            opened in such a session (`owner-link:<code>@<device id>`); `null` otherwise.
            A board with `via.kind` = `desktop` is the desktop app's Hub view: the app shows
            the hub's alerts as notifications itself (desktop.md C9), so the board offers no
            Web Push, install or pairing of "this browser".
          oneOf:
            - type: "null"
            - type: object
              required: [id, kind, name]
              properties:
                id: {type: string}
                kind: {type: string, enum: [machine, desktop, phone, browser]}
                name: {type: string}

    PairCode:
      type: object
      required: [id, kind, code, secret, url, expires_at, qr]
      properties:
        id: {type: string}
        kind: {type: string, enum: [machine, desktop, phone, browser]}
        name: {type: [string, "null"]}
        code: {type: string, description: "Six digits shown as 482-913.", examples: ["482-913"]}
        secret: {type: string, description: 22-character base64url QR secret.}
        url: {type: string, description: "The QR content: <hub>/#/pair?s=<secret>&c=<digits>."}
        expires_at: {type: string, format: date-time}
        command: {type: [string, "null"], description: "For machine codes: sy connect <hub> --code 482-913."}
        qr:
          type: object
          description: QR module matrix of `url` (pairing.md 2.2), quiet zone included.
          required: [size, rows]
          properties:
            size: {type: integer}
            rows:
              type: array
              items: {type: string, pattern: "^[01]+$"}

    PairCodeStatus:
      type: object
      required: [id, kind, status, expires_at]
      properties:
        id: {type: string}
        kind: {type: string}
        status: {type: string, enum: [live, claimed, cancelled, expired]}
        expires_at: {type: string, format: date-time}
        claimed_at: {type: [string, "null"], format: date-time}
        device: {type: [object, "null"], description: "The new device ({id, name, kind}) once claimed."}

    PairClaim:
      type: object
      properties:
        code: {type: string, description: "Six digits; 482913, 482-913 or 482 913."}
        secret: {type: string}
        name: {type: string, maxLength: 60}
        machine: {type: string, description: Required for machine and desktop codes.}
        expect_kind: {type: string, enum: [machine, desktop, phone, browser]}
        cookie: {type: boolean, default: false, description: "Phone and browser codes: set the sy_session cookie instead of returning the token."}
        client: {type: string}
        keys: {$ref: "#/components/schemas/DeviceKeysNew"}
        keys_sealed:
          type: string
          pattern: "^[A-Za-z0-9_-]+$"
          maxLength: 2048
          description: "keys.md 7.1: the `keys` object sealed with the QR's `k` (AES-128-GCM, base64url). Wrong seal: 400 and the code stays live. A `secret` claim must use this, not clear `keys` (400 otherwise)."
      oneOf:
        - {required: [code]}
        - {required: [secret]}

    PairClaimReply:
      type: object
      required: [device, kind, name, scopes, hub]
      properties:
        device: {type: string}
        kind: {type: string}
        name: {type: string}
        scopes:
          type: array
          items: {type: string}
        token: {type: string, description: Shown once; absent in cookie mode.}
        machine: {type: [string, "null"]}
        hub:
          type: object
          properties:
            url: {type: string}
            version: {type: string}
        hub_key: {$ref: "#/components/schemas/PublicKey"}
        owner_key:
          description: "keys.md 7.3: the active owner key document, self-signed and hub-confirmed; null until one is active."
          oneOf:
            - {$ref: "#/components/schemas/SignedDoc"}
            - {type: "null"}
        cert: {$ref: "#/components/schemas/SignedDoc"}
        link:
          type: object
          properties:
            urls:
              type: array
              items: {type: string}
            ping_s: {type: integer}
        reg: {type: string, enum: [qr, tofu, ssh, local]}

    Device:
      type: object
      required: [id, kind, name, scopes, created_at]
      properties:
        id: {type: string}
        kind: {type: string, enum: [machine, desktop, phone, browser]}
        name: {type: string}
        hint: {type: string, description: "sy_p_…k3Qz"}
        scopes:
          type: array
          items: {type: string}
        owner_session: {type: boolean}
        machine: {type: [string, "null"]}
        created_at: {type: string, format: date-time}
        created_by: {type: string}
        last_used_at: {type: [string, "null"], format: date-time}
        last_used_ip: {type: [string, "null"]}
        expires_at: {type: [string, "null"], format: date-time}
        revoked_at: {type: [string, "null"], format: date-time}
        current: {type: boolean, description: The device making this request.}
        prefs: {$ref: "#/components/schemas/DevicePrefs"}
        targets:
          type: array
          items: {$ref: "#/components/schemas/PushTarget"}
        keys:
          description: "keys.md 4: present once the device has link keys."
          oneOf:
            - {$ref: "#/components/schemas/DeviceKeyInfo"}
            - {type: "null"}
        link: {$ref: "#/components/schemas/LinkStatus"}

    QuietHours:
      type: object
      required: [enabled, start, end]
      properties:
        enabled: {type: boolean}
        start: {type: string, pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"}
        end: {type: string, pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"}
        tz: {type: string, description: IANA time zone.}
        critical: {type: boolean, default: true, description: Let rules with bypass_quiet through.}

    DevicePrefs:
      type: object
      description: push.md 5.4. Missing keys take their defaults.
      properties:
        mute:
          type: array
          items: {type: string}
        quiet_hours:
          oneOf:
            - {$ref: "#/components/schemas/QuietHours"}
            - {type: "null"}
        private: {type: [boolean, "null"]}
        tap: {type: string, enum: [auto, session, claude], default: auto}
        tz: {type: [string, "null"]}
        widgets:
          type: boolean
          default: false
          description: Widget refresh frames to this device's link target (push.md 13.5).

    PushSettings:
      type: object
      description: push.md 2.
      properties:
        quiet_hours: {$ref: "#/components/schemas/QuietHours"}
        private: {type: boolean}
        skip_remote: {type: boolean}
        snooze_min: {type: integer, minimum: 5, maximum: 240}
        max_age_s: {type: integer, minimum: 60, maximum: 86400}
        batch_s: {type: integer, minimum: 0, maximum: 30}
        flood:
          type: object
          properties:
            max: {type: integer, minimum: 1}
            per_s: {type: integer, minimum: 60}
        vapid_subject: {type: string}
        webpush_hosts:
          type: array
          items: {type: string}
        refresh_min:
          type: integer
          minimum: 10
          maximum: 240
          default: 15
          description: Least minutes between two widget refresh frames to one link target (push.md 13.5).

    Channel:
      type: object
      required: [kind, enabled]
      properties:
        kind: {type: string, enum: [webpush, ntfy, link]}
        enabled: {type: boolean}
        settings:
          type: object
          additionalProperties: true
          description: Per kind.
          properties:
            urls:
              type: array
              maxItems: 4
              items: {type: string, format: uri, pattern: "^wss://"}
              description: "link: the URLs devices try, in order (push.md 13.6)."
            ping_s: {type: integer, minimum: 60, maximum: 900, default: 180, description: "link: default ping interval."}

    PushConfig:
      type: object
      required: [vapid_public_key, channels]
      properties:
        vapid_public_key: {type: string, description: "Uncompressed P-256 point, base64url (applicationServerKey)."}
        channels:
          type: array
          items: {$ref: "#/components/schemas/Channel"}
        ntfy_default_server: {type: string}

    PushTargetNew:
      type: object
      required: [kind]
      properties:
        kind: {type: string, enum: [webpush, ntfy]}
        name: {type: string, maxLength: 60}
        endpoint: {type: string, description: webpush only.}
        keys:
          type: object
          description: webpush only.
          required: [p256dh, auth]
          properties:
            p256dh: {type: string}
            auth: {type: string}
        server: {type: string, description: "ntfy only; default https://ntfy.sh"}
        topic: {type: string, pattern: "^[-_A-Za-z0-9]{1,64}$", description: ntfy only; generated when omitted.}
        token: {type: string, description: "ntfy access token; stored, never returned."}
        private: {type: boolean, description: ntfy only.}

    PushTarget:
      type: object
      required: [id, kind, enabled, status]
      properties:
        id: {type: string}
        kind: {type: string, enum: [webpush, ntfy, link]}
        link: {$ref: "#/components/schemas/LinkStatus"}
        device: {type: [string, "null"]}
        name: {type: [string, "null"]}
        endpoint_host: {type: string, description: "web.push.apple.com, ntfy.sh…"}
        endpoint: {type: [string, "null"], description: "Full endpoint: only to the owning device and the owner."}
        server: {type: [string, "null"]}
        topic: {type: [string, "null"]}
        token_set: {type: boolean}
        enabled: {type: boolean}
        status: {type: string, enum: [ok, failing, gone, disabled, new]}
        last_ok_at: {type: [string, "null"], format: date-time}
        last_error: {type: [string, "null"]}
        last_error_at: {type: [string, "null"], format: date-time}
        prefs: {$ref: "#/components/schemas/DevicePrefs"}
        created_at: {type: string, format: date-time}

    PushTestResult:
      type: object
      required: [outcome]
      properties:
        outcome: {type: string, enum: [sent, retry, gone, failed]}
        http_status: {type: [integer, "null"]}
        error: {type: [string, "null"]}

    RuleScope:
      type: object
      properties:
        seats:
          type: array
          items: {type: string}
        projects:
          type: array
          items: {type: string}
        machines:
          type: array
          items: {type: string}
        windows:
          type: array
          items: {type: string}

    RuleInput:
      type: object
      properties:
        trigger: {type: string, enum: [needs_permission, asked, failed, limit_80, limit_95, reset, machine_silent]}
        enabled: {type: boolean}
        delay_s: {type: integer, minimum: 0, maximum: 86400}
        bypass_quiet: {type: boolean}
        scope: {$ref: "#/components/schemas/RuleScope"}

    Rule:
      type: object
      required: [id, trigger, base, enabled, delay_s, bypass_quiet, scope]
      properties:
        id: {type: string}
        trigger: {type: string}
        base: {type: boolean}
        enabled: {type: boolean}
        delay_s: {type: integer}
        bypass_quiet: {type: boolean}
        scope: {$ref: "#/components/schemas/RuleScope"}
        updated_at: {type: string, format: date-time}

    AlertStatus:
      type: string
      enum: [pending, fired, snoozed, seen, cancelled, closed, skipped]

    AlertBrief:
      type: object
      required: [id, status]
      properties:
        id: {type: string}
        trigger: {type: string}
        status: {$ref: "#/components/schemas/AlertStatus"}
        reason: {type: [string, "null"]}
        due_at: {type: [string, "null"], format: date-time}
        fired_at: {type: [string, "null"], format: date-time}
        fire_count: {type: integer}
        snoozed_until: {type: [string, "null"], format: date-time}
        seen_at: {type: [string, "null"], format: date-time}

    Alert:
      allOf:
        - {$ref: "#/components/schemas/AlertBrief"}
        - type: object
          properties:
            rule: {type: [string, "null"]}
            session: {type: [string, "null"]}
            seat: {type: [string, "null"]}
            machine: {type: [string, "null"]}
            window_key: {type: [string, "null"]}
            title: {type: string, description: Push title as rendered for a non-private target.}
            body: {type: [string, "null"]}
            url: {type: string, description: Deep link (push.md 5.8).}
            created_at: {type: string, format: date-time}
            since_at: {type: [string, "null"], format: date-time}
            ended_at: {type: [string, "null"], format: date-time}
            deliveries:
              type: array
              items: {$ref: "#/components/schemas/Delivery"}

    Delivery:
      type: object
      required: [target, kind, status, fire]
      properties:
        target: {type: string}
        kind: {type: string, enum: [webpush, ntfy, link]}
        target_name: {type: [string, "null"]}
        fire: {type: integer}
        batch: {type: [string, "null"]}
        status: {type: string, enum: [pending, held, sent, failed, skipped, gone]}
        reason: {type: [string, "null"]}
        tries: {type: integer}
        http_status: {type: [integer, "null"]}
        delivered_at: {type: [string, "null"], format: date-time, description: "link: when the device acked the frame (push.md 13.4)."}
        updated_at: {type: string, format: date-time}

    PublicKey:
      type: object
      required: [pub, fp]
      properties:
        alg: {type: string, enum: [ed25519, x25519, p256]}
        pub: {type: string, description: "base64url, no padding (keys.md 2)."}
        fp: {type: string, pattern: "^[a-z2-7]{24}$"}

    SignedDoc:
      type: object
      description: "keys.md 4.1. Each signature is Ed25519 over \"sy-doc-v1\\n\" + type + \"\\n\" + body bytes. A verifier requires exactly the signers keys.md 4.1 names for the type, each `by` once."
      required: [type, body, sigs]
      properties:
        type: {type: string, enum: [owner_key, device_cert, matrix, revocations, peer_envelope]}
        body: {type: string, description: The signed body bytes, base64url.}
        sigs:
          type: array
          minItems: 1
          maxItems: 2
          items:
            type: object
            required: [by, fp, sig]
            properties:
              by: {type: string, enum: [hub, owner, device]}
              fp: {type: string, pattern: "^[a-z2-7]{24}$"}
              sig: {type: string, pattern: "^[A-Za-z0-9_-]{86}$"}

    DeviceKeysNew:
      type: object
      description: "keys.md 7.1. Machines: ed25519 + x25519. Phones: p256 + p256 and the 16-byte RFC 8291 auth secret."
      required: [sign, box]
      properties:
        sign:
          type: object
          required: [alg, pub]
          properties:
            alg: {type: string, enum: [ed25519, p256]}
            pub: {type: string}
        box:
          type: object
          required: [alg, pub]
          properties:
            alg: {type: string, enum: [x25519, p256]}
            pub: {type: string}
        auth: {type: string, description: "Phones only: 16 bytes, base64url."}

    DeviceKeyInfo:
      type: object
      required: [sign_fp, box_fp, reg, owner_signed]
      properties:
        sign_fp: {type: string}
        box_fp: {type: string}
        reg: {type: string, enum: [qr, tofu, ssh, local]}
        owner_signed: {type: boolean}
        certified_at: {type: [string, "null"], format: date-time}

    OwnerKey:
      type: object
      required: [fp, pub, state]
      properties:
        fp: {type: string}
        pub: {type: string}
        state: {type: string, enum: [pending, active, retired]}
        proposed_by: {type: string}
        created_at: {type: string, format: date-time}
        confirmed_at: {type: [string, "null"], format: date-time}
        doc: {$ref: "#/components/schemas/SignedDoc", description: "The owner_key document: the self-signature, plus the hub's once confirmed (keys.md 3.3)."}

    KeysInfo:
      type: object
      required: [hub_key]
      properties:
        hub_key: {$ref: "#/components/schemas/PublicKey"}
        owner_key:
          oneOf:
            - {$ref: "#/components/schemas/OwnerKey"}
            - {type: "null"}
        pending:
          type: array
          description: Owner only.
          items: {$ref: "#/components/schemas/OwnerKey"}
        revocations_version: {type: integer}
        devices:
          type: array
          description: "Owner and write callers only (`sy keys certify` on the owner machine, keys.md 4.2 step 2): live devices with a verified certificate."
          items:
            type: object
            required: [id, kind, name, keys]
            properties:
              id: {type: string}
              kind: {type: string}
              name: {type: string}
              keys: {$ref: "#/components/schemas/DeviceKeyInfo"}

    LinkStatus:
      type: [object, "null"]
      description: "link.md 9. Null for devices without link keys."
      properties:
        connected: {type: boolean}
        transport: {type: [string, "null"], enum: [ws, poll, null]}
        connected_at: {type: [string, "null"], format: date-time}
        last_seen_at: {type: [string, "null"], format: date-time}
        queued: {type: integer}
        acked_seq: {type: integer}
        last_close: {type: [string, "null"]}

    LinkFrame:
      type: object
      description: "link.md 4-6. Hub frames have `t`, `seq`, `exp`, `tag`, `body` and `sig`; `body` is sealed for queued frames and the plain signed JSON for ephemeral ones (seq 0). `challenge` has its own fields (link.md 3.1). Device frames have their fields inline and no `sig`."
      required: [t]
      properties:
        t: {type: string}
        seq: {type: integer, minimum: 0}
        exp: {type: integer}
        tag: {type: string}
        body: {type: string}
        sig: {type: string}
      additionalProperties: true

    LinkPollRequest:
      type: object
      required: [op]
      properties:
        op: {type: string, enum: [challenge, poll]}
        hello: {$ref: "#/components/schemas/LinkFrame", description: "Required for poll. Its signed `last` is the cumulative ack (link.md 2.1)."}
        up:
          type: array
          maxItems: 64
          items: {$ref: "#/components/schemas/LinkFrame"}

    LinkPollReply:
      type: object
      description: "The reply to op poll. op challenge answers the challenge frame itself (LinkFrame)."
      properties:
        welcome: {$ref: "#/components/schemas/LinkFrame"}
        frames:
          type: array
          items: {$ref: "#/components/schemas/LinkFrame"}
        results:
          type: array
          items: {$ref: "#/components/schemas/LinkFrame"}
        next: {$ref: "#/components/schemas/LinkFrame"}

    PeerSession:
      type: object
      required: [session, handle, account, machine, state]
      properties:
        session: {type: string}
        handle: {type: string}
        name: {type: string}
        account: {type: string}
        account_label: {type: [string, "null"]}
        machine: {type: string}
        machine_name: {type: string}
        project: {type: [string, "null"]}
        state: {$ref: "#/components/schemas/SessionState"}
        agent: {type: boolean, description: The machine runs sy agent.}

    Matrix:
      type: object
      description: peers.md 5.1.
      required: [v, version, paused, same_account, max_turns, allow]
      properties:
        v: {type: integer, const: 1}
        version: {type: integer, minimum: 1}
        issued_at: {type: string, format: date-time}
        paused: {type: boolean}
        same_account: {type: boolean}
        max_turns: {type: integer, minimum: 2, maximum: 500}
        accounts:
          type: object
          additionalProperties: {type: string}
        allow:
          type: array
          items:
            type: array
            minItems: 2
            maxItems: 2
            items: {type: string}

    MatrixInfo:
      type: object
      required: [doc, matrix, signer]
      properties:
        doc: {$ref: "#/components/schemas/SignedDoc"}
        matrix: {$ref: "#/components/schemas/Matrix"}
        signer: {type: string, enum: [owner, hub]}
        widens: {type: boolean}
        made_by: {type: string}
        created_at: {type: string, format: date-time}

    MatrixEdit:
      type: object
      description: Applied to the current version; the hub signs the result.
      properties:
        base_version: {type: integer, description: "Must equal the current version (409 otherwise)."}
        allow:
          type: array
          items:
            type: array
            minItems: 2
            maxItems: 2
            items: {type: string}
        deny:
          type: array
          items:
            type: array
            minItems: 2
            maxItems: 2
            items: {type: string, description: "Account uuid or * (deny only)."}
        paused: {type: boolean}
        same_account: {type: boolean}
        max_turns: {type: integer, minimum: 2, maximum: 500}

    PeerMessage:
      type: object
      required: [id, thread, from, to, kind, size, status, created_at]
      properties:
        id: {type: string}
        thread: {type: string}
        from:
          type: object
          properties:
            session: {type: string}
            device: {type: string}
            account: {type: string}
        to:
          type: object
          properties:
            session: {type: string}
            device: {type: string}
            account: {type: string}
        kind: {type: string, enum: [start, reply]}
        size: {type: integer}
        local: {type: boolean}
        status: {type: string, enum: [queued, delivered, refused, rejected, expired, target_gone, failed]}
        detail: {type: [string, "null"]}
        created_at: {type: string, format: date-time}
        final_at: {type: [string, "null"], format: date-time}

    PeerAuditEntry:
      type: object
      required: [id, at, actor, event]
      properties:
        id: {type: integer}
        at: {type: string, format: date-time}
        actor: {type: string}
        event:
          type: string
          description: >-
            matrix, pause, resume, loop_guard, rejected, thread_resume, or
            thread_resume_refused (a machine refused a thread resume and keeps its stop; detail
            `machine`, peers.md 6.3). Clients show an unknown event by its name.
        thread: {type: [string, "null"]}
        msg: {type: [string, "null"]}
        detail: {type: object, additionalProperties: true}

    AndroidRelease:
      type: object
      description: phone.md P16.1, plus the hub's download URL.
      required: [version, build, sha256, cert_sha256, url]
      properties:
        v: {type: integer}
        version: {type: string}
        build: {type: integer}
        min_sdk: {type: integer}
        apk: {type: string}
        size: {type: integer}
        sha256: {type: string, pattern: "^[0-9a-f]{64}$"}
        cert_sha256: {type: string, pattern: "^[0-9a-f]{64}$"}
        notes: {type: string}
        published_at: {type: string, format: date-time}
        url: {type: string}
