// sy-scan: the pairing QR scanner (docs/spec/phone.md P2). One dependency:
// zxing-android-embedded (Apache-2.0; ZXing's decoder and its own camera code, no Google Play
// services or ML Kit). It replaces expo-camera's barcode scanner, which pulled in
// play-services-code-scanner and ML Kit.
plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'dev.switchyard'
version = '0.1.0'

android {
  namespace 'dev.switchyard.scan'
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
  }
}

dependencies {
  implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
}
