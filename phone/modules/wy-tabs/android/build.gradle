// wy-tabs: one claude.ai WebView per seat, each in its own WebView profile (phone.md P17).
// One dependency: androidx.webkit for ProfileStore / WebViewCompat.setProfile (MULTI_PROFILE).
plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'dev.watchyard'
version = '0.1.0'

android {
  namespace 'dev.watchyard.tabs'
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
  }
}

dependencies {
  implementation 'androidx.webkit:webkit:1.14.0'

  testImplementation 'junit:junit:4.13.2'
}
