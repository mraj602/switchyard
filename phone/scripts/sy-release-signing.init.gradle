// Gradle init script for `make phone-apk-release` (phone.md P13, P16). It signs the app's release
// build with YOUR keystore, which lives outside this repository: expo prebuild regenerates
// android/ every time, so the signing config cannot live there. Everything comes from the
// environment (release-apk.sh exports it, from your shell or from your properties file):
//   WY_ANDROID_KEYSTORE            absolute path of the keystore
//   WY_ANDROID_KEY_ALIAS           the key's alias
//   WY_ANDROID_KEYSTORE_PASSWORD   the keystore password
//   WY_ANDROID_KEY_PASSWORD        the key password (the keystore password when unset)
// A missing value fails the build; no value is ever printed or written to a file.
//
// Ordering matters: this afterEvaluate is registered when the project is created, so it runs
// after the app's own build.gradle (whose release build type points at the debug key, expo
// prebuild's template) and before the Android plugin's own afterEvaluate freezes the DSL.
allprojects { p ->
  p.afterEvaluate {
    if (!p.plugins.hasPlugin('com.android.application')) return
    def need = { String name ->
      def v = System.getenv(name)
      if (v == null || v.isEmpty()) throw new GradleException("release signing: ${name} is not set (see phone/README.md)")
      v
    }
    def store = need('WY_ANDROID_KEYSTORE')
    def alias = need('WY_ANDROID_KEY_ALIAS')
    def storePw = need('WY_ANDROID_KEYSTORE_PASSWORD')
    def keyPw = System.getenv('WY_ANDROID_KEY_PASSWORD') ?: storePw
    if (!new File(store).isFile()) throw new GradleException('release signing: WY_ANDROID_KEYSTORE is not a file')
    p.android {
      signingConfigs {
        syRelease {
          storeFile new File(store)
          keyAlias alias
          storePassword storePw
          keyPassword keyPw
        }
      }
      buildTypes {
        release {
          signingConfig signingConfigs.syRelease
        }
      }
    }
  }
}
